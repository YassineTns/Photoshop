<!--
  The detached preview panel.

  A second entrypoint that shows nothing but the render, at whatever size its
  own window happens to be. Float it, drag it to a second monitor, size it to
  taste: the docked panel keeps the controls, this keeps the picture.

  It owns no state and drives no rendering - frames arrive already rasterised
  through src/ui/framebus.js - so it cannot disagree with the docked preview.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="src/ui/styles.css" />
  </head>
  <body>
    <div id="detached">
      <div id="detached-wrap" class="detached-wrap">
        <div id="detached-empty" class="detached-empty">
          Waiting for Halftone Studio.
        </div>
        <img id="detached-img" class="detached-img" />
        <div id="detached-badge" class="preview-badge"></div>
      </div>
    </div>

    <script src="preview-main.js"></script>
  </body>
</html>

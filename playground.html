<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halftone Studio — playground</title>
<style>
/*
 * Halftone Studio panel styling.
 *
 * DIRECTION: "noir editorial". Near-black, strictly flat surfaces; hierarchy
 * comes from a step in background luminance and a 1px rule, never from a shadow.
 * Titles are capitals with wide letter-spacing against lower-case body text at
 * the same size, so the contrast is casing and spacing rather than scale. One
 * accent - a deep red - rationed to the primary action and to live state, never
 * used as a large flat area.
 *
 * PROVENANCE: this direction was proposed rather than sampled. omerta.fr, the
 * reference, blocks automated access (robots.txt), so nothing here is measured
 * from that site; it is a coherent art direction in the same register, tuned
 * contrast-first for an 11px panel. Every value lives in the tokens below, so
 * recalibrating against real screenshots is a token edit and nothing more.
 *
 * WRITTEN FOR UXP, NOT FOR A BROWSER
 * ----------------------------------
 * UXP's CSS engine is a subset, and the gaps are not the ones you would guess.
 * Four rules here exist because the obvious version rendered as a pile of
 * overlapping controls:
 *
 *  1. NO `gap`. Flex gap is ignored, so every space is an explicit margin.
 *     Without this, controls sit flush against each other.
 *
 *  2. NO fixed `height` on anything containing a form control. UXP's native
 *     input is taller than a text line, so a 22px row let its input overflow
 *     into the row below. Everything uses `min-height`.
 *
 *  3. INPUTS GET AN EXPLICIT `width`, never just a flex basis. A UXP text input
 *     asserts its own intrinsic width and wins against `flex: 0 0 46px`, which
 *     is what collapsed every slider to nothing and stretched the number field
 *     across the panel.
 *
 *  4. NO `::before` / `::after`. Pseudo-elements do not render, so anything they
 *     would have drawn (the disclosure caret, the brand mark, the tick beside a
 *     bar label) is a real element with real content in it.
 *
 * Flex longhand is used throughout rather than the shorthand, for the same
 * reason: it is the form UXP handles predictably.
 *
 * NOTHING HERE NEEDS TO DEGRADE
 * -----------------------------
 * The previous revision leaned on gradients and glows and had to be built so
 * that UXP dropping them cost nothing. This direction is flat by intent: no
 * gradients, no shadows, no glows anywhere. That removes the failure mode
 * rather than handling it - there is no decoration left for UXP to ignore.
 *
 * TWO REDS, TOLD APART BY FORM
 * ----------------------------
 * `--accent` and `--danger` are both red and at 10px are indistinguishable by
 * hue. They are separated by shape instead, and the rule is absolute: the
 * accent appears ONLY as a filled area, and an error appears ONLY as text with
 * a 1px rule and a tinted background, never filled. A third token,
 * `--accent-on-dark-text`, exists because the accent red only reaches 3.35:1 on
 * the dark background - fine behind white text, illegible as text itself - so
 * red *text* uses the lighter value.
 */

:root {
  --bg: #0b0b0c;
  --bg-raised: #16161a;
  --bg-raised-hi: #1f1f24;
  --bg-sunken: #070709;
  --border: #2a2a30;
  --border-strong: #3e3e46;
  --text: #f2f1ee;
  --text-dim: #a5a4a0;
  --text-faint: #858480;
  --accent: #c8102e;
  --accent-2: #c9a227;
  --accent-hi: #e11836;
  --accent-soft: #2a1116;
  --accent-text: #ffffff;
  /* The accent is only 3.35:1 on --bg, so red *text* uses this instead. */
  --accent-on-dark-text: #ff3b52;
  --track: #2a2a30;
  --fill: #55555e;
  --danger: #ff6b6b;
  --warn: #e8a33d;
  --ok: #3dd68c;
  --radius: 4px;
  --radius-sm: 2px;
  --font-ui: "Adobe Clean", -apple-system, "Segoe UI Variable Text", "Segoe UI",
    "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display: "Adobe Clean", -apple-system, "Segoe UI Variable Display",
    "Segoe UI Semibold", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
}

/*
 * The light theme is the same composition in daylight. The accent darkens
 * rather than lightens - on white, a hover that gets brighter reads as fading -
 * and `--accent-on-dark-text` collapses back onto the accent because the
 * contrast problem it solves does not exist here.
 */
@media (prefers-color-scheme: light) {
  :root {
    --bg: #fbfaf8;
    --bg-raised: #ffffff;
    --bg-raised-hi: #f2f0ec;
    --bg-sunken: #edebe6;
    --border: #dcd9d2;
    --border-strong: #b9b5ac;
    --text: #111112;
    --text-dim: #55534e;
    --text-faint: #7c7a74;
    --accent: #a50e26;
    --accent-2: #8a6b12;
    --accent-hi: #8a0b1f;
    --accent-soft: #fbebee;
    --accent-text: #ffffff;
    --accent-on-dark-text: #a50e26;
    --track: #dcd9d2;
    --fill: #8a8781;
    --danger: #b3261e;
    --warn: #8a5a00;
    --ok: #146b3a;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 11px;
  -webkit-user-select: none;
  user-select: none;
}

/*
 * THE FROZEN HEAD AND THE SCROLLING BODY
 *
 * `#app` fills the panel and does not scroll. It holds exactly two children:
 *
 *   #head    the brand, the preview, the status line and the action buttons.
 *            Never scrolls, so the preview is on screen the whole time you are
 *            working through the controls. A slider you cannot see the effect
 *            of is not a slider you can use.
 *   #scroll  everything else. Takes whatever height is left and scrolls it.
 *
 * A UXP panel does not scroll its document for you, so the scrolling region has
 * to be an element with a definite height and its own overflow. `#app` gets that
 * height from the four insets, which pin it to the initial containing block -
 * the panel viewport - rather than depending on an unbroken height:100% chain
 * through html and body, which silently does nothing the moment one ancestor
 * forgets it. `#scroll` then takes the remainder with flex-grow.
 *
 * `min-height: 0` on `#scroll` is for Chromium, not for UXP: a browser gives
 * flex items an automatic minimum size, which would stop it shrinking below its
 * content and so stop it ever scrolling. UXP does not implement that minimum,
 * so there it is already free to shrink. Stating it explicitly makes the two
 * engines agree - which is exactly what the layout test needs in order to mean
 * anything.
 */
#app {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 11px;
  background-color: var(--bg);
}

#head {
  flex-grow: 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  /* A hard rule, so a control clipped at the top of the list reads as scrolled
     under the head rather than as a rendering fault. */
  border-bottom: 1px solid var(--border-strong);
  padding-bottom: 12px;
}

#scroll {
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  /* Room for the scrollbar, so it never sits on top of a control. */
  padding-right: 2px;
  padding-top: 14px;
}

/*
 * Nothing inside either region may be compressed.
 *
 * Both are column flex containers with a definite height, so by default every
 * child is shrinkable - and they were shrunk, squeezing each section down and
 * clipping its rows against `overflow: hidden`. Worse, UXP paints native inputs
 * in a layer that ignores that clip, so the sliders vanished while their number
 * fields floated loose over the next section.
 *
 * A browser hides this: CSS gives flex items an automatic minimum size, so they
 * refuse to shrink below their content. UXP does not implement that, so the
 * floor has to be stated. With shrinking off, content simply overflows and
 * `#scroll` scrolls, which is the whole point of it.
 */
#head > *,
#scroll > * {
  margin-bottom: 10px;
  flex-shrink: 0;
}

/* The head's own padding provides the gap; a trailing margin would double it. */
#head > *:last-child { margin-bottom: 0; }

/* Air between blocks, per the direction: generous vertically, tight inside. */
#scroll > .preset-bar { margin-top: 6px; }

/* ------------------------------------------------------------ brand */

.brand {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 22px;
  margin-bottom: 10px;
}

/*
 * The mark is a four-dot halftone ramp: the plugin's whole idea in 18 pixels.
 * Four real divs, because pseudo-elements do not render here.
 */
.brand-mark {
  position: relative;
  width: 18px;
  height: 18px;
  min-width: 18px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 10px;
  background-color: var(--accent);
}

.brand-dot {
  position: absolute;
  border-radius: 50%;
  background-color: var(--bg);
}

.brand-dot-1 { width: 7px; height: 7px; left: 2px; top: 2px; }
.brand-dot-2 { width: 5px; height: 5px; left: 11px; top: 3px; }
.brand-dot-3 { width: 5px; height: 5px; left: 3px; top: 11px; }
.brand-dot-4 { width: 3px; height: 3px; left: 12px; top: 12px; }

.brand-name {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-family: var(--font-display);
}

/* Panel title: capitals at 0.12em, per the direction's spacing table. */
.brand-name-a {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--text);
}

.brand-name-b {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  margin-left: 6px;
}

/* Says which engine is running without opening the Mode section. */
.brand-mode {
  flex-grow: 0;
  flex-shrink: 0;
  min-height: 17px;
  padding: 1px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background-color: var(--bg-raised);
  color: var(--text-dim);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* A rule, which in this direction is the structural device, not a decoration. */
.rule {
  min-height: 1px;
  height: 1px;
  margin-bottom: 12px;
  background-color: var(--border);
}

/* ----------------------------------------------------------- status */

.status {
  display: flex;
  flex-direction: row;
  align-items: center;
  color: var(--text-dim);
  font-size: 10px;
  min-height: 14px;
  margin-bottom: 10px;
}

.status-dot {
  width: 6px;
  height: 6px;
  min-width: 6px;
  border-radius: 50%;
  background-color: var(--text-faint);
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 8px;
}

.status-dot.ready { background-color: var(--ok); }
.status-dot.busy { background-color: var(--accent-on-dark-text); }
.status-dot.error { background-color: var(--danger); }

#status-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
}

/* ---------------------------------------------------------- preview */

.preview-wrap {
  position: relative;
  flex-shrink: 0;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  min-height: 112px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 0;
}

/*
 * The frame may be rasterised for a larger detached window than this box, so
 * both maxima are needed. With width and height both auto, the two constraints
 * are applied proportionally and the aspect ratio survives.
 */
.preview {
  display: none;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
}

.preview.visible { display: block; }

.preview-empty {
  color: var(--text-faint);
  font-size: 10px;
  text-align: center;
  padding: 26px 16px;
  line-height: 1.8;
}

.preview-empty b {
  color: var(--text-dim);
  font-weight: 600;
}

.preview-empty.hidden { display: none; }

/*
 * Hidden until it has something to say. `:empty` would do this in a browser but
 * is not worth relying on here, so the panel toggles the class.
 */
.preview-badge { display: none; }

.preview-badge.show {
  display: block;
  position: absolute;
  right: 6px;
  bottom: 6px;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

/*
 * Split compare.
 *
 * The original sits on top of the render, clipped to the left of a draggable
 * handle. Both halves are the same frame at the same scale, so the seam runs
 * straight through whatever you are looking at - which is the whole point, and
 * what a hold-to-swap button cannot do: you cannot compare two things you never
 * see at the same time.
 *
 * Clipping is a wrapper with `overflow: hidden` and a width, not `clip-path`,
 * which UXP does not implement.
 */
.split { display: none; }

.split.show {
  display: block;
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
}

.split-clip {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 50%;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

/*
 * The image inside a clip that is narrower than the box must not be re-centred
 * by the flex layout, or the two halves would show different parts of the
 * picture and the comparison would be a lie. It is pinned to the box's own
 * geometry instead.
 */
.split-img {
  position: absolute;
  top: 0;
  left: 0;
  max-width: none;
  max-height: none;
}

.split-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 13px;
  margin-left: -6px;
  cursor: ew-resize;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

.split-grip {
  width: 1px;
  height: 100%;
  background-color: var(--accent);
}

.split-handle:hover .split-grip,
.split.dragging .split-grip {
  width: 3px;
  background-color: var(--accent-hi);
}

/* Drag to resize the preview; double-click to go back to automatic. */
.preview-grip {
  min-height: 11px;
  height: 11px;
  margin-bottom: 10px;
  cursor: ns-resize;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

.grip-line {
  width: 36px;
  height: 2px;
  min-height: 2px;
  border-radius: 1px;
  background-color: var(--border-strong);
}

.preview-grip:hover .grip-line { background-color: var(--text-faint); }
.preview-grip.dragging .grip-line { background-color: var(--accent-on-dark-text); }

/*
 * Zoom bar.
 *
 * The preview used to be a thumbnail of the whole document, which on a 6000px
 * image puts a halftone dot at a third of a screen pixel - you could not see
 * what you were about to commit to. 1:1 is the point of this row.
 */
.zoombar {
  display: flex;
  flex-direction: row;
  align-items: center;
  margin-bottom: 10px;
}

.zoombar > * {
  margin-right: 5px;
}

.zoombar > *:last-child { margin-right: 0; }

.zoom-btn {
  min-height: 20px;
  min-width: 24px;
  flex-grow: 0;
  flex-shrink: 0;
  padding: 0 6px;
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-family: var(--font-ui);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
}

.zoom-btn:hover { color: var(--text); border-color: var(--border-strong); }

.zoom-word {
  min-width: 34px;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.zoom-btn.active {
  background-color: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.zoom-level {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Dragging inside the preview pans it, once there is something to pan. */
.preview-wrap.pannable { cursor: grab; }
.preview-wrap.panning { cursor: grabbing; }

/* --------------------------------------------------------- controls */

.actions {
  display: flex;
  flex-direction: column;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background-color: var(--bg-raised);
}

.toolbar {
  display: flex;
  flex-direction: row;
  align-items: stretch;
}

.toolbar > * {
  margin-right: 6px;
}

.toolbar > *:last-child { margin-right: 0; }

.toolbar-tail { margin-top: 6px; }

/*
 * Outline by default, filled only for the primary action - the direction is
 * explicit that two filled buttons never sit side by side. Capitals at 0.08em,
 * per its spacing table.
 */
.btn {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  min-height: 26px;
  padding: 0 6px;
  background-color: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-family: var(--font-ui);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn:hover {
  border-color: var(--text-dim);
  color: var(--text);
}

.btn:active { background-color: var(--bg-raised-hi); }

.btn[disabled] {
  opacity: 0.34;
  cursor: default;
  border-color: var(--border);
}

.btn[disabled]:hover {
  border-color: var(--border);
  color: var(--text);
}

.btn-primary {
  background-color: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.btn-primary:hover {
  background-color: var(--accent-hi);
  border-color: var(--accent-hi);
  color: var(--accent-text);
}

.btn-small {
  min-height: 22px;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  border-color: var(--border);
}

.btn-small:hover { border-color: var(--border-strong); }

/*
 * Only on screen while something is running that can actually be stopped, so
 * it never offers a promise it cannot keep. The panel toggles the class.
 *
 * Outline and text, never filled: the direction reserves flat red for the
 * accent, and an error or a stop is told apart from it by form rather than hue.
 */
.btn-cancel { display: none; }

.btn-cancel.show {
  display: block;
  color: var(--accent-on-dark-text);
  border-color: var(--accent-on-dark-text);
  background-color: var(--accent-soft);
}

.btn-cancel.show:hover {
  color: var(--accent-on-dark-text);
  border-color: var(--accent-on-dark-text);
}

/* A parent row with nothing visible in it must not leave a gap behind. */
.toolbar-hidden { display: none; }

.progress {
  min-height: 2px;
  height: 2px;
  background-color: var(--track);
  overflow: hidden;
  opacity: 0;
  margin-bottom: 10px;
}

.progress.active { opacity: 1; }

.progress-bar {
  height: 2px;
  width: 0%;
  background-color: var(--accent);
}

/* --------------------------------------------------------- sections */

.sections {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/*
 * The accent rail is the left border rather than an extra element: one property
 * to light up, no absolute positioning, and `box-sizing: border-box` keeps the
 * width identical open or closed so nothing shifts when a section expands.
 */
.section {
  border: 1px solid var(--border);
  border-left: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: var(--bg-raised);
  margin-bottom: 5px;
  flex-shrink: 0;
  overflow: hidden;
}

.section.open {
  border-color: var(--border-strong);
  border-left-color: var(--accent);
}

.section-head {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 8px 11px;
  cursor: pointer;
  min-height: 23px;
}

.section-head:hover { background-color: var(--bg-raised-hi); }

/* A real glyph, because pseudo-elements and CSS triangles both fail in UXP. */
.section-caret {
  width: 9px;
  min-width: 9px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 9px;
  font-size: 7px;
  line-height: 1;
  color: var(--text-faint);
}

.section.open .section-caret { color: var(--accent-on-dark-text); }

/* Section label: capitals at 0.18em, the widest step in the spacing table. */
.section-title {
  flex-grow: 0;
  flex-shrink: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.section.open .section-title { color: var(--text); }
.section-head:hover .section-title { color: var(--text); }

/*
 * The collapsed section's readout. Monospace, right-aligned, dim, and allowed
 * to be cut off: it is a reminder, never the only way to see a value.
 */
.section-summary {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  margin-left: 10px;
  text-align: right;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* An open section shows the real controls; repeating them in the head is noise. */
.section.open .section-summary { display: none; }

.section-body {
  display: none;
  padding: 4px 11px 10px;
  border-top: 1px solid var(--border);
  background-color: var(--bg-raised);
}

.section.open .section-body { display: block; }

/* ----------------------------------------------------------- slider */

.ctl {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 28px;
  flex-shrink: 0;
}

.ctl > * {
  margin-right: 8px;
}

.ctl > *:last-child { margin-right: 0; }

/* Body text: lower case, no letter-spacing at all, per the direction. */
.ctl-label {
  width: 64px;
  min-width: 64px;
  flex-grow: 0;
  flex-shrink: 0;
  color: var(--text-dim);
  letter-spacing: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ctl-label.modified { color: var(--text); }

.slider {

  flex-grow: 1;
  flex-shrink: 1;

  min-height: 22px;
  display: flex;
  flex-direction: row;
  align-items: center;
  cursor: ew-resize;
}

.slider-track {
  position: relative;
  width: 100%;
  height: 2px;
  min-height: 2px;
  background-color: var(--track);
}

.slider-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  background-color: var(--fill);
}

/* Only a moved slider takes the accent: colour marks state, it does not decorate. */
.ctl.modified .slider-fill { background-color: var(--accent); }

.slider-thumb {
  position: absolute;
  top: -4px;
  width: 10px;
  height: 10px;
  margin-left: -5px;
  border-radius: 50%;
  background-color: var(--text);
  border: 1px solid var(--bg);
}

.slider:hover .slider-thumb { background-color: var(--accent-on-dark-text); }
.slider.dragging .slider-thumb { background-color: var(--accent); }

 * Explicit width: a UXP input asserts its own and would eat the slider.
 * Monospace, so the numbers stop dancing as they change - this is a readout.
 */
.ctl-value {

  min-width: 66px;
  flex-grow: 0;
  flex-shrink: 0;
  min-height: 22px;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 10px;
  text-align: right;
  padding: 0 6px;
  -webkit-user-select: text;
  user-select: text;
}

.ctl.modified .ctl-value { color: var(--text); border-color: var(--border-strong); }
.ctl-value:hover { border-color: var(--border-strong); }
/* Focus is a 1px accent rule, not a halo: the direction allows no shadows. */
.ctl-value:focus { border-color: var(--accent-on-dark-text); }

.ctl-reset {
  width: 14px;
  min-width: 14px;
  flex-grow: 0;
  flex-shrink: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  font-family: inherit;
  margin-right: 0;
  visibility: hidden;
}

.ctl.modified .ctl-reset { visibility: visible; }
.ctl-reset:hover { color: var(--accent-on-dark-text); }

.seg {
  display: flex;
  flex-direction: row;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background-color: var(--bg-sunken);
}

.seg-item {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  min-height: 22px;
  text-align: center;
  background-color: transparent;
  color: var(--text-dim);
  border: 0;
  border-right: 1px solid var(--border);
  font-size: 9px;
  font-family: var(--font-ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 0 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.seg-item:last-child { border-right: 0; }

.seg-item.active {
  background-color: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.seg-item:hover { color: var(--text); background-color: var(--bg-raised-hi); }
.seg-item.active:hover { color: var(--accent-text); background-color: var(--accent-hi); }

/* ------------------------------------------------------------ chips */

.chip-row {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.chip-row > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.chip-group-label {
  color: var(--text-faint);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin-top: 6px;
  margin-bottom: 4px;
}

.algo-chip {

  padding: 0 8px;
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: var(--font-ui);
  white-space: nowrap;
}

.algo-chip:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.algo-chip.active {
  background-color: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
  font-weight: 600;
}

.toggle {

  min-width: 32px;
  height: 18px;
  min-height: 18px;

  flex-shrink: 0;
  border-radius: var(--radius-sm);

  position: relative;
  cursor: pointer;
  padding: 0;
}

  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background-color: var(--text-faint);
}

  background-color: var(--accent);

  left: 16px;
  background-color: var(--accent-text);

  color: var(--text);

  font-size: 10px;
  padding: 0 4px;
  -webkit-user-select: text;
  user-select: text;
}

  bottom: 2px;

  flex-direction: row;
  flex-wrap: wrap;
  margin-top: 3px;
}

.palette-actions > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.hint {
  color: var(--text-faint);
  font-size: 9px;
  line-height: 1.6;

  flex-direction: column;
}

.bar-label {
  display: flex;
  flex-direction: row;
  align-items: center;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
}

  width: 2px;
  height: 9px;
  min-width: 2px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 8px;
  background-color: var(--accent);
}

  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
}

.preset-list > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

  min-height: 22px;
  padding: 0 9px;
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: var(--font-ui);
  white-space: nowrap;
}

.preset-chip:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.preset-chip.active {
  background-color: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
  font-weight: 600;
}

.preset-chip.user { border-style: dashed; }

/*
 * Never a filled area, whatever it is reporting. Flat red belongs to the
 * accent alone; a message is a rule plus a tint plus text, so the two reds are

  color: var(--text-dim);
  -webkit-user-select: text;
  user-select: text;

          ].join(",")
        : "-",
    ].join("|");
    if (this._analysis && this._analysis.key === key) return this._analysis;

    const t0 = now();
    let img = fitWithin(this.source, target);
    // Pre-process radii are expressed per 1000px of the longest edge, so the
    // visual result is identical whatever resolution we analyse at.
    const scale = Math.max(img.width, img.height) / 1000;

    img = preprocess(img, params, scale);

    if (params.mode === "dither") {
      img = applyToneToImage(img, buildToneLUT(params), params.invert);
    }

    this.stats.analysisMs = now() - t0;
    this.stats.analysisSize = `${img.width}x${img.height}`;
    this._analysis = { key, img, target };
    this._cells = null;
    this._dither = null;
    this._screens = null;
    return this._analysis;
  }

  /* ------------------------------------------------------------------ *
   * Stage 2a: halftone cell measurement
   * ------------------------------------------------------------------ */

  _ensureCells(params) {
    const analysis = this._ensureAnalysis(params);
    const key = `${analysis.key}|${this.resolution(params)}|${params.angle}|${params.lumaMode}|${params.edgeAware}`;
    if (this._cells && this._cells.key === key) return this._cells.cells;

    const t0 = now();
    const grid = computeGrid(
      analysis.img.width,
      analysis.img.height,
      this.resolution(params),
      params.angle
    );
    const cells = sampleCells(analysis.img, grid, params.lumaMode);
    if (params.edgeAware) refineCellsEdgeAware(analysis.img, grid, cells);
    this.stats.sampleMs = now() - t0;
    this.stats.cells = grid.cols * grid.rows;
    this._cells = { key, cells };
    return cells;
  }

  /**
   * Which palette entry each cell resolves to.
   *
   * This is a third of the per-frame cost and almost none of it is ever new.
   * Deciding a cell's colour means converting its mean RGB to OKLab and
   * searching the palette - and neither depends on radius, dot curve, shape,
   * dot gain, screen type, jitter or any other geometry control. Before this
   * cache, dragging the Radius slider redid a hundred and sixty thousand OKLab
   * conversions per frame to arrive at exactly the answers it already had.
   *
   * The key is everything that genuinely changes the answer: the cells
   * themselves, the palette being matched against, and the hue/saturation/
   * brightness adjustment, which is applied to both sides of the comparison.
   *
   * @returns {Uint8Array} one palette index per cell
   */
  _ensureCellColors(params, cells, rp) {
    const count = cells.grid.cols * cells.grid.rows;
    const key = [
      this._cells ? this._cells.key : "",
      count,
      paletteToHex(rp.palette).join(","),
      params.hue,
      params.saturation,
      params.brightness,
    ].join("|");
    if (this._cellColors && this._cellColors.key === key) return this._cellColors.index;

    const t0 = now();
    const labPal = paletteToLab(rp.palette);
    const adj = rp.colorAdjust || {};
    const out = new Uint8Array(count);
    const tmp = [0, 0, 0];

    for (let ci = 0; ci < count; ci++) {
      const cnt = cells.count[ci];
      if (cnt === 0) continue;
      const q = ci * 3;
      adjustColor(cells.rgb[q] / cnt, cells.rgb[q + 1] / cnt, cells.rgb[q + 2] / cnt, adj, tmp);
      out[ci] = nearestIndex(labPal, tmp[0], tmp[1], tmp[2]);
    }

    this.stats.colorMs = now() - t0;
    this._cellColors = { key, index: out };
    return out;
  }

  /* ------------------------------------------------------------------ *
   * Stage 2b: dither
   * ------------------------------------------------------------------ */

  _ensureDither(params, maxGrid) {
    const analysis = this._ensureAnalysis(params, maxGrid);
    const matchPalette = this._matchPalette(params);
    const key = [
      analysis.key,
      params.ditherAlgorithm,
      params.ditherStrength,
      params.serpentine,
      params.tonalMapping ? `${params.shadowSplit},${params.highlightSplit}` : "-",
      paletteToHex(matchPalette).join(","),
    ].join("|");
    if (this._dither && this._dither.key === key) return this._dither;

    const t0 = now();
    const indices = ditherToIndices(analysis.img, {
      labPal: paletteToLab(matchPalette),
      palette: matchPalette,
      algorithm: params.ditherAlgorithm,
      strength: params.ditherStrength,
      serpentine: params.serpentine,
      zoneRange: makeZoneRange(matchPalette.length, params),
    });
    this.stats.ditherMs = now() - t0;
    this.stats.cells = analysis.img.width * analysis.img.height;
    this._dither = {
      key,
      indices,
      width: analysis.img.width,
      height: analysis.img.height,
      exact: !maxGrid || this.resolution(params) <= maxGrid,
    };
    return this._dither;
  }

  /* ------------------------------------------------------------------ *
   * Stage 2c: per-ink screens (halftone, screenMode "perInk")
   * ------------------------------------------------------------------ */

  /**
   * One screen per ink, each on its own grid at its own angle, each carrying the
   * coverage of that ink per cell.
   *
   * Sampling is repeated per ink because the grids genuinely differ - that is
   * the whole point - but it runs on the analysis image, so N passes over a few
   * hundred thousand pixels is cheap next to what it buys.
   */
  _ensureScreens(params) {
    const analysis = this._ensureAnalysis(params);
    const rp = this._rasterParams(params);
    // Separate against the UNADJUSTED inks: hue and saturation are pointwise
    // recolouring, so applying them here would only invalidate the cache and
    // change nothing about which ink goes where.
    const inks = rp.inkIndices.map((i) => rp.matchPalette[i]);
    const matchBg =
      params.background && params.background !== "auto"
        ? rp.background
        : rp.matchPalette[rp.paperIndex];
    const order = inkOrder(inks);
    const angles = screenAngles(inks.length, params.angle, params.screenSpread);

    const key = [
      analysis.key,
      this.resolution(params),
      params.angle,
      params.screenSpread,
      params.lumaMode,
      params.edgeAware,
      params.contrast,
      params.gamma,
      params.blackPoint,
      params.whitePoint,
      params.exposure,
      params.gradeBias,
      params.invert,
      rp.matchPalette.join(","),
      matchBg.join(","),
    ].join("|");
    if (this._screens && this._screens.key === key) {
      // Colours are recoloured on the way out, so a cached screen set is still
      // valid after a hue or saturation change.
      return this._recolourScreens(this._screens, rp);
    }

    const t0 = now();
    const basis = buildInkBasis(inks, matchBg);
    const lut = rp.toneLUT;
    const cov = new Float64Array(inks.length);
    const graded = [0, 0, 0];

    // One sampling pass per distinct angle; identical angles share their grid.
    const gridCache = new Map();
    const cellCache = new Map();
    const screens = [];

    for (let rank = 0; rank < order.length; rank++) {
      const k = order[rank];
      const angle = angles[rank];
      const akey = angle.toFixed(4);
      if (!gridCache.has(akey)) {
        const g = computeGrid(
          analysis.img.width,
          analysis.img.height,
          this.resolution(params),
          angle
        );
        const c = sampleCells(analysis.img, g, params.lumaMode);
        if (params.edgeAware) refineCellsEdgeAware(analysis.img, g, c);
        gridCache.set(akey, g);
        cellCache.set(akey, c);
      }
      const grid = gridCache.get(akey);
      const cells = cellCache.get(akey);
      const n = grid.cols * grid.rows;
      const coverage = new Float32Array(n);

      for (let i = 0; i < n; i++) {
        const cnt = cells.count[i];
        if (!cnt) continue;
        // Grade the cell colour per channel, then invert, then separate. Doing
        // it here rather than per pixel keeps this O(cells).
        for (let ch = 0; ch < 3; ch++) {
          const v = sampleLUTByte(lut, cells.rgb[i * 3 + ch] / cnt);
          graded[ch] = params.invert ? 255 - v : v;
        }
        unmix(basis, graded, cov);
        coverage[i] = biasCurve(Math.min(1, cov[k]), params.gradeBias);
      }

      screens.push({
        grid,
        cov: coverage,
        count: cells.count,
        color: inks[k],
        inkSlot: k,
        paletteIndex: rp.inkIndices[k],
        angle,
      });
    }

    this.stats.screenMs = now() - t0;
    this.stats.screens = screens.length;
    this.stats.cells = screens.reduce((a, s2) => a + s2.grid.cols * s2.grid.rows, 0);
    this._screens = { key, screens, rp };
    return this._recolourScreens(this._screens, rp);
  }

  /** Point a cached screen set at the currently adjusted ink colours. */
  _recolourScreens(cached, rp) {
    for (const sc of cached.screens) {
      const idx = rp.inkIndices[sc.inkSlot];
      if (idx !== undefined && rp.fullPalette[idx]) sc.color = rp.fullPalette[idx];
    }
    cached.rp = rp;
    return cached;
  }

  /* ------------------------------------------------------------------ *
   * Stage 3: palette
   * ------------------------------------------------------------------ */

  extractPalette(params) {
    const analysis = this._ensureAnalysis(params);
    const key = `${analysis.key}|${params.colorCount}|${params.quantMethod}`;
    if (this._basePalette && this._basePalette.key === key) return this._basePalette.palette;
    const t0 = now();
    const palette = extractPalette(analysis.img, {
      count: params.colorCount,
      method: params.quantMethod,
    });
    this.stats.paletteMs = now() - t0;
    this._basePalette = { key, palette };
    return palette;
  }

  extractPaletteHex(params) {
    return paletteToHex(this.extractPalette(params));
  }

  /**
   * The palette used for *matching*, before hue/saturation/brightness.
   *
   * Colour adjustments are pointwise, so applying them to both the image and the
   * palette would leave the matching almost unchanged while costing a full pixel
   * pass. Matching against the unadjusted palette and emitting the adjusted one
   * is equivalent and keeps Hue at O(colours) in both modes.
   */
  _matchPalette(params) {
    let base;
    if (params.paletteLocked && Array.isArray(params.palette) && params.palette.length) {
      base = padPalette(hexToPalette(params.palette), params.palette.length);
    } else {
      base = this.extractPalette(params);
    }
    return applySpread(base, params.spread);
  }

  /** The palette actually emitted. */
  _outputPalette(params) {
    return adjustPalette(this._matchPalette(params), {
      hue: params.hue,
      saturation: params.saturation,
      brightness: params.brightness,
    });
  }

  /**
   * Decide, once, which palette entry is the paper and which are inks - and do
   * it on the *unadjusted* palette, by index.
   *
   * Deciding on the adjusted palette instead would mean Hue could silently
   * re-pick a different paper (luminance ordering can flip under rotation), and
   * it would make every hue change invalidate the cached screens. Indices are
   * stable; only the colours they map to move.
   *
   * @returns {{match: number[][], out: number[][], paperIndex: number,
   *            inkIndices: number[], background: number[]}}
   */
  _paletteStructure(params) {
    const match = this._matchPalette(params).map((c) => c.slice());
    const out = adjustPalette(match, {
      hue: params.hue,
      saturation: params.saturation,
      brightness: params.brightness,
    });

    let paperIndex;
    let background;
    const explicit = params.background && params.background !== "auto" ? hexToRgb(params.background) : null;

    if (explicit) {
      background = explicit;
      // An explicit paper that matches a palette entry consumes it, so the
      // engine does not also try to print with it.
      const near = inkPalette(match, explicit);
      if (near.length < match.length) {
        paperIndex = match.findIndex((c) => !near.some((k) => k[0] === c[0] && k[1] === c[1] && k[2] === c[2]));
      } else {
        match.push(explicit.slice());
        out.push(explicit.slice());
        paperIndex = match.length - 1;
      }
    } else {
      paperIndex = pickBackgroundIndex(match, params.invert);
      background = out[paperIndex];
    }
    if (paperIndex < 0 || paperIndex >= match.length) paperIndex = 0;

    const inkIndices = [];
    for (let i = 0; i < match.length; i++) if (i !== paperIndex) inkIndices.push(i);
    if (!inkIndices.length) inkIndices.push(paperIndex);

    return { match, out, paperIndex, inkIndices, background };
  }

  /* ------------------------------------------------------------------ *
   * Stage 4: rasterisation
   * ------------------------------------------------------------------ */

  _rasterParams(params) {
    const st = this._paletteStructure(params);
    const ink = st.inkIndices.map((i) => st.out[i]);
    // Blue noise drives FM screening: no low-frequency energy, so the dots read
    // as an even grain instead of a pattern. Built once and cached.
    let fmThreshold = null;
    if (params.screenType === "fm") {
      const m = blueNoiseMatrix(64);
      fmThreshold = (col, row) => m.data[(row % m.size) * m.size + (col % m.size)];
    }

    return {
      radius: params.radius,
      shape: params.shape,
      screenType: params.screenType,
      fmThreshold,
      jitter: {
        jitterPosition: params.jitterPosition,
        jitterSize: params.jitterSize,
        jitterAngle: params.jitterAngle,
        seed: params.seed,
      },
      dotGain: params.dotGain,
      waveAmount: params.waveAmount,
      waveLength: params.waveLength,
      gradeBias: params.gradeBias,
      radiusCurve: params.radiusCurve,
      invert: params.invert,
      toneLUT: buildToneLUT(params),
      // Dots may use every palette colour except the paper - see inkPalette().
      palette: ink,
      inkPalette: ink,
      inkToPaletteIndex: st.inkIndices.slice(),
      fullPalette: st.out,
      matchPalette: st.match,
      inkIndices: st.inkIndices,
      paperIndex: st.paperIndex,
      background: st.background,
      colorAdjust: {
        hue: params.hue,
        saturation: params.saturation,
        brightness: params.brightness,
      },
    };
  }

  /**
   * Synchronous render.
   *
   * @param {object} params sanitised parameters
   * @param {{width?: number, height?: number, out?: Uint8ClampedArray,
   *          maxDitherGrid?: number}} [opts]
   *        `maxDitherGrid` caps the dither grid so previews stay fast; when the
   *        requested resolution exceeds it, the result is flagged `exact: false`.
   */
  /**
   * @param {object} params
   * @param {object} [opts]
   * @param {number} [opts.width]  the *virtual* render width
   * @param {number} [opts.height] the *virtual* render height
   * @param {{x:number,y:number,width:number,height:number}} [opts.view]
   *        a window of that virtual render to actually produce. This is how
   *        zooming works: the grid is still built for the full virtual size, so
   *        a dot sits in exactly the same place whether you are looking at the
   *        whole image or at one corner of it at 1:1 - it is the same render,
   *        cropped, not a different one derived at a different scale. Cells
   *        outside the window are skipped, so the cost is the window's rather
   *        than the document's.
   */
  render(params, opts = {}) {
    if (!this.source) throw new Error("HalftoneEngine: no source set");
    const width = opts.width || this.source.width;
    const height = opts.height || this.source.height;
    const view = opts.view || null;
    const outW = view ? view.width : width;
    const outH = view ? view.height : height;

    if (params.mode === "dither") {
      const d = this._ensureDither(params, opts.maxDitherGrid);
      const palette = this._outputPalette(params);
      const t0 = now();
      const data = indicesToRGBA(
        d.indices, d.width, d.height, palette, width, height, opts.out, view
      );
      this.stats.rasterMs = now() - t0;
      return {
        data,
        width: outW,
        height: outH,
        palette: paletteToHex(palette),
        ink: paletteToHex(palette),
        background: palette[0] || [0, 0, 0],
        exact: d.exact,
      };
    }

    if (params.screenMode === "perInk") {
      const { screens, rp: srp } = this._ensureScreens(params);
      const t0 = now();
      if (view) {
        srp.viewX = view.x;
        srp.viewY = view.y;
      }
      const data = rasterizeScreens(
        this._scaleScreens(screens, width, height, params),
        srp,
        outW,
        outH,
        opts.out
      );
      this.stats.rasterMs = now() - t0;
      return {
        data,
        width: outW,
        height: outH,
        palette: paletteToHex(srp.fullPalette),
        ink: paletteToHex(srp.palette),
        background: srp.background,
        angles: screens.map((sc) => sc.angle),
        exact: true,
      };
    }

    const cells = this._ensureCells(params);
    const rp = this._rasterParams(params);
    rp.cellColor = this._ensureCellColors(params, cells, rp);
    const grid = scaleGrid(cells.grid, width, height);
    const outCells = { lum: cells.lum, rgb: cells.rgb, count: cells.count, grid };
    if (view) {
      rp.viewX = view.x;
      rp.viewY = view.y;
    }

    const t0 = now();
    const data = rasterize(outCells, rp, outW, outH, opts.out);
    this.stats.rasterMs = now() - t0;

    return {
      data,
      width: outW,
      height: outH,
      palette: paletteToHex(rp.fullPalette),
      ink: paletteToHex(rp.palette),
      background: rp.background,
      exact: true,
    };
  }

  /**
   * Re-express every screen's grid at the output resolution.
   *
   * Misregistration is applied here rather than at measurement time because it
   * is a rendering offset in output pixels: derived from the scaled cell size,
   * it looks identical on a preview and on a full render.
   */
  _scaleScreens(screens, width, height, params) {
    const amount = params ? params.misregistration : 0;
    const seed = params ? params.seed : 0;
    const off = [0, 0];
    return screens.map((sc, i) => {
      const grid = scaleGrid(sc.grid, width, height);
      inkOffset(i, amount, grid.cell, seed, off);
      return {
        grid,
        cov: sc.cov,
        count: sc.count,
        color: sc.color,
        inkSlot: sc.inkSlot,
        paletteIndex: sc.paletteIndex,
        angle: sc.angle,
        offsetX: off[0],
        offsetY: off[1],
      };
    });
  }

  /**
   * Render to one 8-bit coverage mask per palette colour, for the separated
   * fill-layer output. Masks are mutually exclusive and sum to 255, so the
   * stack reproduces the flat render regardless of layer order.
   *
   * @returns {{masks: Uint8ClampedArray[], palette: string[], paperIndex: number,
   *            width: number, height: number}}
   */
  renderSeparated(params, opts = {}) {
    if (!this.source) throw new Error("HalftoneEngine: no source set");
    const width = opts.width || this.source.width;
    const height = opts.height || this.source.height;

    if (params.mode === "dither") {
      const d = this._ensureDither(params, opts.maxDitherGrid);
      const palette = this._outputPalette(params);
      const masks = indicesToMasks(d.indices, d.width, d.height, palette.length, width, height);
      return {
        masks,
        palette: paletteToHex(palette),
        paperIndex: 0,
        blend: "normal",
        exclusive: true,
        width,
        height,
      };
    }

    if (params.screenMode === "perInk") {
      const { screens, rp: srp } = this._ensureScreens(params);
      const scaled = this._scaleScreens(screens, width, height, params);
      const inkMasks = rasterizeScreensSeparated(scaled, srp, width, height);
      // Transparent inks overlap by design, so the masks are NOT exclusive and
      // the fill layers must be set to Multiply over an opaque paper.
      const paper = new Uint8ClampedArray(width * height).fill(255);
      const masks = [];
      const palette = [];
      masks.push(paper);
      palette.push(paletteToHex([srp.background])[0]);
      for (let i = 0; i < scaled.length; i++) {
        masks.push(inkMasks[i]);
        palette.push(paletteToHex([scaled[i].color])[0]);
      }
      return {
        masks,
        palette,
        paperIndex: 0,
        blend: "multiply",
        exclusive: false,
        width,
        height,
      };
    }

    const cells = this._ensureCells(params);
    const rp = this._rasterParams(params);
    const grid = scaleGrid(cells.grid, width, height);
    const outCells = { lum: cells.lum, rgb: cells.rgb, count: cells.count, grid };
    const masks = rasterizeSeparated(outCells, rp, width, height);
    return {
      masks,
      palette: paletteToHex(rp.fullPalette),
      paperIndex: rp.paperIndex,
      blend: "normal",
      exclusive: true,
      width,
      height,
    };
  }

  /**
   * Export the render as SVG.
   *
   * Halftone only: dithering is one shape per pixel, so even a modest grid runs
   * to hundreds of thousands of rectangles and no viewer would open the result.
   * The caller is told that rather than handed a useless file.
   *
   * @returns {{svg: string, shapes: number, busy: boolean}}
   */
  renderSVG(params, opts = {}) {
    if (!this.source) throw new Error("HalftoneEngine: no source set");
    if (params.mode === "dither") {
      throw new Error(
        "SVG export covers halftone mode only. A dither is one shape per pixel, " +
          "which no vector application can usefully open."
      );
    }
    const width = opts.width || this.source.width;
    const height = opts.height || this.source.height;

    let res;
    if (params.screenMode === "perInk") {
      const { screens, rp } = this._ensureScreens(params);
      res = screensSVG(this._scaleScreens(screens, width, height, params), rp, width, height);
    } else {
      const cells = this._ensureCells(params);
      const rp = this._rasterParams(params);
      const grid = scaleGrid(cells.grid, width, height);
      res = halftoneSVG(
        { lum: cells.lum, rgb: cells.rgb, count: cells.count, grid },
        rp,
        width,
        height
      );
    }
    return { svg: res.svg, shapes: res.shapes, busy: res.shapes > BUSY_SHAPE_COUNT };
  }

  /**
   * Chunked render that yields to the event loop between bands so Photoshop's
   * UI keeps breathing on very large documents.
   */
  async renderAsync(params, opts = {}) {
    if (!this.source) throw new Error("HalftoneEngine: no source set");
    const width = opts.width || this.source.width;
    const height = opts.height || this.source.height;
    const onProgress = opts.onProgress || noop;
    const shouldCancel = opts.shouldCancel || (() => false);

    onProgress(0.02);

    if (params.mode === "dither") {
      // The dither runs on a grid that is small by construction; the expansion
      // to output size is the part worth chunking.
      const d = this._ensureDither(params, opts.maxDitherGrid);
      if (shouldCancel()) return null;
      onProgress(0.5);
      const palette = this._outputPalette(params);
      const data = indicesToRGBA(d.indices, d.width, d.height, palette, width, height, opts.out);
      onProgress(1);
      return {
        data,
        width,
        height,
        palette: paletteToHex(palette),
        ink: paletteToHex(palette),
        background: palette[0] || [0, 0, 0],
        exact: d.exact,
      };
    }

    if (params.screenMode === "perInk") {
      const { screens, rp: srp } = this._ensureScreens(params);
      if (shouldCancel()) return null;
      onProgress(0.2);
      const scaled = this._scaleScreens(screens, width, height, params);
      const data = opts.out || new Uint8ClampedArray(width * height * 4);
      for (let i = 0; i < scaled.length; i++) {
        rasterizeScreens(scaled, srp, width, height, data, {
          screenStart: i,
          screenEnd: i + 1,
          skipBackground: i !== 0,
        });
        onProgress(0.2 + 0.8 * ((i + 1) / scaled.length));
        if (shouldCancel()) return null;
        // eslint-disable-next-line no-await-in-loop
        await yieldToHost();
      }
      return {
        data,
        width,
        height,
        palette: paletteToHex(srp.fullPalette),
        ink: paletteToHex(srp.palette),
        background: srp.background,
        angles: scaled.map((sc) => sc.angle),
        exact: true,
      };
    }

    const cells = this._ensureCells(params);
    if (shouldCancel()) return null;
    onProgress(0.2);

    const rp = this._rasterParams(params);
    const grid = scaleGrid(cells.grid, width, height);
    const outCells = { lum: cells.lum, rgb: cells.rgb, count: cells.count, grid };

    const data = opts.out || new Uint8ClampedArray(width * height * 4);
    const t0 = now();

  row.appendChild(input);

      out.set(scratch.subarray(0, stride), 1);
    }
  }

  // If the winner was found early and then a later type broke out of its loop,
  // `out` still holds the winner - `out` is only written when a type completes
  // with a better score, and the early break can only happen on a worse one.
  return bestType;
}

/* ------------------------------------------------------------------ *
 * PNG
 * ------------------------------------------------------------------ */

/**
 * @param {Uint8Array|Uint8ClampedArray} rgba length = width*height*4
 * @param {number} width
 * @param {number} height
 * @param {(raw: Uint8Array) => Uint8Array} [deflate] optional replacement
 *        compressor. Node tooling can pass zlib.deflateSync; the panel uses the
 *        built-in one, which is the point of this file being dependency-free.
 * @returns {Uint8Array} PNG bytes
 */
function encodePNG(rgba, width, height, deflate) {
  // A preview is always opaque - the renderer fills the paper colour across the
  // whole frame - so the alpha channel is a quarter of the bytes carrying no
  // information. Dropping it to colour type 2 takes a quarter off the filtering,
  // the compression, the base64 and the host's own decode. The scan that decides
  // costs one pass over the pixels, which is nothing against what it saves.
  const opaque = isOpaque(rgba, width * height);
  const bpp = opaque ? 3 : 4;
  const stride = width * bpp;

  const buf = scratchFor(stride, height);
  const raw = buf.raw;

  // Two row buffers when dropping alpha, because filtering reads the previous
  // row and it must not be the one being rebuilt.
  let cur = buf.rgb;
  let prev = buf.rgbPrev;
  let prior = null;

  for (let y = 0; y < height; y++) {
    let row;
    if (opaque) {
      for (let x = 0, i = y * width * 4, o = 0; x < width; x++, i += 4, o += 3) {
        cur[o] = rgba[i];
        cur[o + 1] = rgba[i + 1];
        cur[o + 2] = rgba[i + 2];
      }
      row = cur;
    } else {
      row = rgba.subarray(y * stride, y * stride + stride);
    }
    filterRow(row, prior, stride, buf.rowOut, buf.scratch, bpp);
    raw.set(buf.rowOut, y * (stride + 1));
    // The filter is defined against the *unfiltered* previous row.
    prior = row;
    if (opaque) {
      const t = cur;
      cur = prev;
      prev = t;
    }
  }

  const z = deflate ? deflate(raw) : zlibDeflate(raw);

  const chunks = [];
  chunks.push(new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]));

  const ihdr = new Uint8Array(13);
  writeU32(ihdr, 0, width);
  writeU32(ihdr, 4, height);
  ihdr[8] = 8; // bit depth
  ihdr[9] = opaque ? 2 : 6; // colour type: RGB or RGBA
  ihdr[10] = 0;
  ihdr[11] = 0;
  ihdr[12] = 0;
  chunks.push(makeChunk("IHDR", ihdr));
  chunks.push(makeChunk("IDAT", z));
  chunks.push(makeChunk("IEND", new Uint8Array(0)));

  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let p = 0;
  for (const c of chunks) {
    out.set(c, p);
    p += c.length;
  }
  return out;
}

/** @returns {boolean} whether every pixel is fully opaque. */
function isOpaque(rgba, pixels) {
  for (let i = 3, n = pixels * 4; i < n; i += 4) {
    if (rgba[i] !== 255) return false;
  }
  return true;
}

/**
 * Reusable working buffers, keyed by shape.
 *
 * The encoder runs on every preview frame and used to allocate about a megabyte
 * each time - the filtered image, a scratch row and a row buffer - all of it
 * garbage a frame later. Keeping one set alive and handing it back removes that
 * churn entirely. It is safe because the buffers never outlive the call: the
 * compressor consumes `raw` before encodePNG returns, and what is returned is a
 * fresh array.
 */
let SCRATCH = null;

function scratchFor(stride, height) {
  const rawLen = (stride + 1) * height;
  if (!SCRATCH || SCRATCH.stride !== stride || SCRATCH.raw.length !== rawLen) {
    SCRATCH = {
      stride,
      raw: new Uint8Array(rawLen),
      scratch: new Uint8Array(stride),
      rowOut: new Uint8Array(stride + 1),
      rgb: new Uint8Array(stride),
      rgbPrev: new Uint8Array(stride),
    };
  }
  return SCRATCH;
}

function makeChunk(type, data) {
  const out = new Uint8Array(12 + data.length);
  writeU32(out, 0, data.length);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(data, 8);
  const crc = crc32(out, 4, 8 + data.length);
  writeU32(out, 8 + data.length, crc);
  return out;
}

function writeU32(buf, off, v) {
  buf[off] = (v >>> 24) & 0xff;
  buf[off + 1] = (v >>> 16) & 0xff;
  buf[off + 2] = (v >>> 8) & 0xff;
  buf[off + 3] = v & 0xff;
}

/* ------------------------------------------------------------------ *
 * Base64
 * ------------------------------------------------------------------ */

const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
const B64_CODES = (() => {
  const t = new Uint8Array(64);
  for (let i = 0; i < 64; i++) t[i] = B64.charCodeAt(i);
  return t;
})();
/** Characters per String.fromCharCode call. Large enough to matter, small
 *  enough that no engine's argument limit is anywhere near. */
const B64_CHUNK = 8192;

/**
 * Base64 without relying on btoa (not guaranteed across UXP versions).
 *
 * Built through a byte buffer and chunked String.fromCharCode rather than
 * appending four characters at a time: on a few hundred kilobytes the naive
 * form was costing more than compressing the image does.
 *
 * @param {Uint8Array} bytes
 * @returns {string}
 */
function toBase64(bytes) {
  const len = bytes.length;
  const outLen = 4 * Math.ceil(len / 3);
  const chars = new Uint8Array(outLen);
  let o = 0;
  let i = 0;

  for (; i + 2 < len; i += 3) {
    const n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
    chars[o++] = B64_CODES[(n >>> 18) & 63];
    chars[o++] = B64_CODES[(n >>> 12) & 63];
    chars[o++] = B64_CODES[(n >>> 6) & 63];
    chars[o++] = B64_CODES[n & 63];
  }
  const rem = len - i;
  if (rem === 1) {
    const n = bytes[i] << 16;
    chars[o++] = B64_CODES[(n >>> 18) & 63];
    chars[o++] = B64_CODES[(n >>> 12) & 63];
    chars[o++] = 61; // '='
    chars[o++] = 61;
  } else if (rem === 2) {
    const n = (bytes[i] << 16) | (bytes[i + 1] << 8);
    chars[o++] = B64_CODES[(n >>> 18) & 63];
    chars[o++] = B64_CODES[(n >>> 12) & 63];
    chars[o++] = B64_CODES[(n >>> 6) & 63];
    chars[o++] = 61;
  }

  let out = "";
  for (let p = 0; p < o; p += B64_CHUNK) {
    out += String.fromCharCode.apply(null, chars.subarray(p, Math.min(p + B64_CHUNK, o)));
  }
  return out;
}

/** @returns {string} a data: URL suitable for <img src=...> */
function toDataURL(rgba, width, height) {
  return "data:image/png;base64," + toBase64(encodePNG(rgba, width, height));
}

module.exports = { encodePNG, toDataURL, toBase64, crc32, adler32, filterRow };

});

</script>
<script>

(function () {
  var require = function (r) { return window.__require("src/playground.js", r); };

  var C = require("./ui/controls.js");
  var P = require("./state/params.js");
  var PRESETS = require("./presets/presets.js");
  var PIPE = require("./engine/pipeline.js");
  var PNG = require("./util/png.js");
  var DITHER = require("./engine/dither.js");

  var ALGO_LABELS = {};
  var ALGO_FAMILY = {};
  DITHER.ALGORITHMS.forEach(function (a) {
    ALGO_LABELS[a.id] = a.label;
    ALGO_FAMILY[a.id] = a.family;
  });

  var engine = new PIPE.HalftoneEngine();
  var params = P.defaultParams();
  var controls = {};
  var sectionOpen = {};
  var lastMs = 0;
  var raf = null;
  var timer = null;
  var sourceURL = null;
  var renderedURL = null;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------------------------------------------------------- */

  function buildSections() {
    var host = $("sections");
    host.textContent = "";
    controls = {};
    P.SECTIONS.forEach(function (sec) {
      if (sec.id === "batch" || sec.id === "output") return; // Photoshop-only
      if (!P.sectionVisible(sec, params)) return;
      var open = sectionOpen[sec.id] !== false;
      var s = C.createSection(sec.id, sec.label, open);
      s.onToggle = function (isOpen) { sectionOpen[sec.id] = isOpen; };
      P.PARAM_DEFS.forEach(function (def) {
        if (def.section !== sec.id) return;
        if (!P.isVisible(def, params)) return;
        s.body.appendChild(buildControl(def));
      });
      host.appendChild(s.el);
    });
  }

  function affectsLayout(key) {
    return key === "mode" || key === "scaleMode" || key === "tonalMapping" ||
           key === "sharpen" || key === "screenMode";
  }

  function buildControl(def) {
    var commit = function (value) { setParam(def.key, value); };
    var ctl;
    switch (def.type) {
      case "slider": ctl = C.createSlider(def, params[def.key], commit); break;
      case "choice": ctl = C.createChoice(def, params[def.key], commit); break;
      case "chips":
        ctl = C.createChipChoice(def, params[def.key], commit, {
          labels: ALGO_LABELS,
          groups: def.key === "ditherAlgorithm" ? DITHER.ALGORITHM_FAMILIES : null,
          groupOf: def.key === "ditherAlgorithm" ? function (id) { return ALGO_FAMILY[id]; } : null
        });
        break;
      case "toggle": ctl = C.createToggle(def, params[def.key], commit); break;
      case "color":
        ctl = C.createColorField(def, params[def.key], commit, function () { return null; });
        break;
      case "palette":
        ctl = C.createPalette({
          value: params.palette,
          locked: params.lockedSwatches,
          onChange: function (hexes, locked) {
            params.palette = hexes;
            params.lockedSwatches = locked || [];
            params.paletteLocked = true;
            params.colorCount = Math.min(8, Math.max(2, hexes.length));
            if (controls.colorCount) controls.colorCount.set(params.colorCount);
            if (controls.paletteLocked) controls.paletteLocked.set(true);
            schedule();
          },
          onExtract: extractPalette,
          getForeground: function () { return null; }
        });
        break;
      default: ctl = { el: C.el("div"), set: function () {} };
    }
    controls[def.key] = ctl;
    return ctl.el;
  }

  function setParam(key, value) {
    if (params[key] === value) return;
    params[key] = value;
    if (key === "colorCount" && params.paletteLocked) syncPaletteToCount();
    if (key === "paletteLocked" && !value) syncPaletteFromImage();
    if (affectsLayout(key)) { buildSections(); syncControls(); }
    schedule();
  }

  function syncControls() {
    P.PARAM_DEFS.forEach(function (def) {
      var c = controls[def.key];
      if (c && c.set) c.set(params[def.key], params.lockedSwatches);
    });
  }

  function mergeLocked(extracted) {
    var locks = params.lockedSwatches || [];
    if (!locks.length) return extracted;
    var out = extracted.slice();
    locks.forEach(function (i) {
      if (i < out.length && params.palette[i]) out[i] = params.palette[i];
    });
    return out;
  }

  function extractPalette() {
    if (!engine.hasSource()) { notice("Load an image first."); return; }
    params.palette = mergeLocked(engine.extractPaletteHex(params));
    params.paletteLocked = true;
    if (controls.palette) controls.palette.set(params.palette, params.lockedSwatches);
    if (controls.paletteLocked) controls.paletteLocked.set(true);
    schedule();
  }

  function syncPaletteToCount() {
    if (!engine.hasSource()) return;
    params.palette = mergeLocked(engine.extractPaletteHex(params));
    if (controls.palette) controls.palette.set(params.palette, params.lockedSwatches);
  }

  function syncPaletteFromImage() {
    if (!engine.hasSource()) return;
    params.palette = mergeLocked(engine.extractPaletteHex(params));
    if (controls.palette) controls.palette.set(params.palette, params.lockedSwatches);
  }

  /* ---------------------------------------------------------------- */

  function schedule() {
    if (!engine.hasSource()) return;
    if (lastMs > 45) {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { timer = null; draw(); }, 90);
      return;
    }
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = null; draw(); });
  }

  function previewSize() {
    var wrap = $("preview-wrap");
    var avail = Math.max(200, Math.min(900, wrap.clientWidth - 2));
    var scale = Math.min(1, avail / engine.source.width);
    return {
      width: Math.max(1, Math.round(engine.source.width * scale)),
      height: Math.max(1, Math.round(engine.source.height * scale))
    };
  }

  function draw() {
    if (!engine.hasSource()) return;
    var t0 = Date.now();
    try {
      var size = previewSize();
      var out = engine.render(params, {
        width: size.width, height: size.height, maxDitherGrid: 900
      });
      renderedURL = PNG.toDataURL(out.data, out.width, out.height);
      $("preview").src = renderedURL;
      $("preview").className = "preview visible";
      $("preview-empty").className = "preview-empty hidden";
      lastMs = Date.now() - t0;
      var unit = params.mode === "dither" ? "px" : "cells";
      var screens = out.angles ? (" · " + out.angles.length + " screens @ " + out.angles.join("/") + "°") : "";
      $("preview-badge").textContent =
        (engine.stats.cells || 0) + " " + unit + screens + " · " + lastMs + "ms" +
        (out.exact ? "" : " · approx");
      notice("");
    } catch (e) {
      lastMs = Date.now() - t0;
      notice("Render failed: " + e.message);
      if (window.console) console.error(e);
    }
  }

  function notice(text) {
    var n = $("notice");
    n.textContent = text || "";
    n.className = text ? "notice show error" : "notice";
  }

  /* ---------------------------------------------------------------- */

  function loadImage(file) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var cv = document.createElement("canvas");
      // Cap the source the same way the plugin caps its read from Photoshop.
      var cap = 2600;
      var s = Math.min(1, cap / Math.max(img.width, img.height));
      cv.width = Math.round(img.width * s);
      cv.height = Math.round(img.height * s);
      var ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      var data = ctx.getImageData(0, 0, cv.width, cv.height);
      engine.setSource({
        data: new Uint8ClampedArray(data.data),
        width: cv.width,
        height: cv.height
      });
      sourceURL = cv.toDataURL("image/png");
      if (!params.paletteLocked) syncPaletteFromImage();
      $("file-name").textContent = file.name + "  " + cv.width + "x" + cv.height;
      draw();
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { notice("Could not decode that image."); };
    img.src = url;
  }

  function renderPresets() {
    var host = $("preset-list");
    host.textContent = "";
    PRESETS.BUILTIN_PRESETS.forEach(function (preset) {
      var chip = C.el("button", "preset-chip", preset.name);
      chip.addEventListener("click", function () {
        params = PRESETS.presetToParams(preset);
        if (!params.paletteLocked) syncPaletteFromImage();
        buildSections();
        syncControls();
        schedule();
      });
      host.appendChild(chip);
    });
  }

  /* ---------------------------------------------------------------- */

  function init() {
    buildSections();
    renderPresets();

    $("file").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]);
    });

    var wrap = $("preview-wrap");
    ["dragenter", "dragover"].forEach(function (t) {
      wrap.addEventListener(t, function (e) {
        e.preventDefault();
        wrap.className = "preview-wrap dragging";
      });
    });
    ["dragleave", "drop"].forEach(function (t) {
      wrap.addEventListener(t, function (e) {
        e.preventDefault();
        wrap.className = "preview-wrap";
      });
    });
    wrap.addEventListener("drop", function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) loadImage(f);
    });

    $("btn-reset").addEventListener("click", function () {
      params = P.defaultParams();
      buildSections();
      syncControls();
      schedule();
    });

    $("btn-save").addEventListener("click", function () {
      if (!renderedURL) return;
      var full = engine.render(params);
      var a = document.createElement("a");
      a.href = PNG.toDataURL(full.data, full.width, full.height);
      a.download = "halftone.png";
      a.click();
    });

    var cmp = $("btn-compare");
    cmp.addEventListener("pointerdown", function () {
      if (sourceURL) $("preview").src = sourceURL;
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) {
      cmp.addEventListener(t, function () {
        if (renderedURL) $("preview").src = renderedURL;
      });
    });

    window.addEventListener("resize", function () { schedule(); });

    // A built-in test image, so the page does something the moment it opens.
    makeSampleImage();
  }

  function makeSampleImage() {
    var w = 900, h = 620;
    var cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    var ctx = cv.getContext("2d");
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#fdf6e3");
    g.addColorStop(0.5, "#e8804f");
    g.addColorStop(1, "#141021");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    var glow = ctx.createRadialGradient(w * 0.38, h * 0.42, 10, w * 0.38, h * 0.42, h * 0.45);
    glow.addColorStop(0, "rgba(255,214,102,0.95)");
    glow.addColorStop(1, "rgba(255,214,102,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    var bar = ctx.createLinearGradient(0, 0, w, 0);
    bar.addColorStop(0, "#000");
    bar.addColorStop(1, "#fff");
    ctx.fillStyle = bar;
    ctx.fillRect(0, h - 70, w, 70);
    var data = ctx.getImageData(0, 0, w, h);
    engine.setSource({ data: new Uint8ClampedArray(data.data), width: w, height: h });
    sourceURL = cv.toDataURL("image/png");
    $("file-name").textContent = "built-in sample  " + w + "x" + h;
    draw();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>

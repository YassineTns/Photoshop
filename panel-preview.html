<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halftone Studio — panel preview</title>
<style>
/*
 * Halftone Studio panel styling.
 *
 * Kept deliberately plain: flat surfaces, one accent, no shadows or gradients,
 * so the panel reads as part of Photoshop rather than as a web page embedded in
 * it. Colours are tokens so the light theme is a token swap, not a rewrite.
 *
 * WRITTEN FOR UXP, NOT FOR A BROWSER
 * ----------------------------------
 * UXP's CSS engine is a subset, and the gaps are not the ones you would guess.
 * Four rules here exist because the obvious version rendered as a pile of
 * overlapping controls:
 *
 *  1. NO `gap`. Flex gap is ignored, so every space is an explicit margin.
 *     Without this, controls sit flush against each other.
 *
 *  2. NO fixed `height` on anything containing a form control. UXP's native
 *     input is taller than a text line, so a 22px row let its input overflow
 *     into the row below. Everything uses `min-height`.
 *
 *  3. INPUTS GET AN EXPLICIT `width`, never just a flex basis. A UXP text input
 *     asserts its own intrinsic width and wins against `flex: 0 0 46px`, which
 *     is what collapsed every slider to nothing and stretched the number field
 *     across the panel.
 *
 *  4. NO `::before` / `::after`. Pseudo-elements do not render, so anything they
 *     would have drawn (the disclosure caret, the user-preset marker) is a real
 *     element with real text in it.
 *
 * Flex longhand is used throughout rather than the shorthand, for the same
 * reason: it is the form UXP handles predictably.
 */

:root {
  --bg: #1e1e1e;
  --bg-raised: #262626;
  --bg-sunken: #171717;
  --border: #383838;
  --border-strong: #4a4a4a;
  --text: #d8d8d8;
  --text-dim: #8f8f8f;
  --text-faint: #6b6b6b;
  --accent: #4a90d9;
  --accent-text: #ffffff;
  --track: #3a3a3a;
  --fill: #6d7076;
  --danger: #d9534f;
  --ok: #57a55a;
  --radius: 3px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f0f0;
    --bg-raised: #ffffff;
    --bg-sunken: #e2e2e2;
    --border: #cccccc;
    --border-strong: #b0b0b0;
    --text: #1f1f1f;
    --text-dim: #5f5f5f;
    --text-faint: #8a8a8a;
    --track: #cdcdcd;
    --fill: #8b8f95;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Adobe Clean", -apple-system, "Segoe UI", sans-serif;
  font-size: 11px;
  -webkit-user-select: none;
  user-select: none;
}

/*
 * The scroll container.
 *
 * A UXP panel does not scroll its document for you: with `#app` simply flowing
 * taller than the panel, everything below the fold was unreachable and there was
 * no scrollbar at all. It needs one element with a definite height and its own
 * overflow.
 *
 * The four insets pin it to the initial containing block - the panel viewport -
 * which gives it that definite height without depending on an unbroken
 * height:100% chain through html and body. `height: 100%` alone silently does
 * nothing the moment one ancestor forgets it.
 */
#app {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  padding: 8px;
}

/*
 * Nothing in the scroll container may be compressed.
 *
 * `#app` is a column flex container with a definite height, so by default every
 * child is shrinkable - and they were shrunk, squeezing each section down and
 * clipping its rows against `overflow: hidden`. Worse, UXP paints native inputs
 * in a layer that ignores that clip, so the sliders vanished while their number
 * fields floated loose over the next section.
 *
 * A browser hides this: CSS gives flex items an automatic minimum size, so they
 * refuse to shrink below their content. UXP does not implement that, so the
 * floor has to be stated. With shrinking off, content simply overflows and the
 * container scrolls, which is the whole point of it.
 */
#app > * {
  margin-bottom: 8px;
  flex-shrink: 0;
}

/* ----------------------------------------------------------- status */

.status {
  display: flex;
  flex-direction: row;
  align-items: center;
  color: var(--text-dim);
  font-size: 10px;
  min-height: 14px;
}

.status-dot {
  width: 6px;
  height: 6px;
  min-width: 6px;
  border-radius: 50%;
  background: var(--text-faint);
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 6px;
}

.status-dot.ready { background: var(--ok); }
.status-dot.busy { background: var(--accent); }
.status-dot.error { background: var(--danger); }

#status-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
}

/* ---------------------------------------------------------- preview */

.preview-wrap {
  position: relative;
  flex-shrink: 0;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 130px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.preview {
  display: none;
  max-width: 100%;
  height: auto;
}

.preview.visible { display: block; }

.preview-empty {
  color: var(--text-faint);
  font-size: 10px;
  text-align: center;
  padding: 24px 12px;
  line-height: 1.6;
}

.preview-empty.hidden { display: none; }

.preview-badge {
  position: absolute;
  right: 4px;
  bottom: 4px;
  background: #000000;
  color: #d0d0d0;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 2px;
}

/* --------------------------------------------------------- controls */

.toolbar {
  display: flex;
  flex-direction: row;
  align-items: stretch;
}

.toolbar > * {
  margin-right: 4px;
}

.btn {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  min-height: 24px;
  padding: 0 6px;
  background: var(--bg-raised);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn:hover { border-color: var(--accent); }
.btn:active { background: var(--bg-sunken); }

.btn[disabled] {
  opacity: 0.4;
  cursor: default;
  border-color: var(--border);
}

.btn[disabled]:hover { border-color: var(--border); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

.btn-small { min-height: 20px; font-size: 10px; }

.progress {
  min-height: 2px;
  height: 2px;
  background: var(--track);
  border-radius: 1px;
  overflow: hidden;
  opacity: 0;
}

.progress.active { opacity: 1; }

.progress-bar {
  height: 2px;
  width: 0%;
  background: var(--accent);
}

/* --------------------------------------------------------- sections */

.sections {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.section {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-raised);
  margin-bottom: 3px;
  flex-shrink: 0;
}

.section-head {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 5px 7px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-dim);
  min-height: 20px;
}

.section-head:hover { color: var(--text); }

/* A real glyph, because pseudo-elements and CSS triangles both fail in UXP. */
.section-caret {
  width: 10px;
  min-width: 10px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 4px;
  font-size: 8px;
  line-height: 1;
  color: var(--text-faint);
}

.section-body {
  display: none;
  padding: 4px 7px 7px;
}

.section.open .section-body { display: block; }

/* ----------------------------------------------------------- slider */

.ctl {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 26px;
  flex-shrink: 0;
}

.ctl > * {
  margin-right: 6px;
}

.ctl-label {
  width: 62px;
  min-width: 62px;
  flex-grow: 0;
  flex-shrink: 0;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ctl-label.modified { color: var(--text); }

.slider {
  position: relative;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 30px;
  min-height: 22px;
  display: flex;
  flex-direction: row;
  align-items: center;
  cursor: ew-resize;
}

.slider-track {
  position: relative;
  width: 100%;
  height: 3px;
  min-height: 3px;
  background: var(--track);
  border-radius: 2px;
}

.slider-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 3px;
  background: var(--fill);
  border-radius: 2px;
}

.slider-thumb {
  position: absolute;
  top: -3px;
  width: 9px;
  height: 9px;
  margin-left: -4px;
  border-radius: 50%;
  background: var(--text);
  border: 1px solid var(--bg);
}

.slider.dragging .slider-thumb { background: var(--accent); }

/* Explicit width: a UXP input asserts its own and would eat the slider. */
.ctl-value {
  width: 52px;
  min-width: 52px;
  flex-grow: 0;
  flex-shrink: 0;
  min-height: 20px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--text);
  font-size: 10px;
  text-align: right;
  padding: 0 4px;
  font-family: inherit;
  -webkit-user-select: text;
  user-select: text;
}

.ctl-value:focus { border-color: var(--accent); }

.ctl-reset {
  width: 14px;
  min-width: 14px;
  flex-grow: 0;
  flex-shrink: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  font-family: inherit;
  margin-right: 0;
  visibility: hidden;
}

.ctl.modified .ctl-reset { visibility: visible; }
.ctl-reset:hover { color: var(--text); }

/* ----------------------------------------------------- segmented set */

.seg {
  display: flex;
  flex-direction: row;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  overflow: hidden;
}

.seg-item {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  min-height: 20px;
  text-align: center;
  background: var(--bg-raised);
  color: var(--text-dim);
  border: 0;
  border-right: 1px solid var(--border);
  font-size: 10px;
  cursor: pointer;
  padding: 0 2px;
  font-family: inherit;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.seg-item:last-child { border-right: 0; }
.seg-item.active { background: var(--accent); color: var(--accent-text); }
.seg-item:hover { color: var(--text); }
.seg-item.active:hover { color: var(--accent-text); }

/* ------------------------------------------------------------ chips */

.chip-row {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.chip-row > * {
  margin-right: 3px;
  margin-bottom: 3px;
}

.chip-group-label {
  color: var(--text-faint);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 3px;
  margin-bottom: 2px;
}

.algo-chip {
  min-height: 19px;
  padding: 0 6px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}

.algo-chip:hover { color: var(--text); border-color: var(--border-strong); }
.algo-chip.active {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}

/* --------------------------------------------------------- toggle */

.toggle {
  width: 30px;
  min-width: 30px;
  height: 16px;
  min-height: 16px;
  flex-grow: 0;
  flex-shrink: 0;
  border-radius: 8px;
  background: var(--track);
  border: 1px solid var(--border-strong);
  position: relative;
  cursor: pointer;
  padding: 0;
}

.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 5px;
  background: var(--text-dim);
}

.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on .toggle-knob { left: 16px; background: #ffffff; }

/* -------------------------------------------------------- palette */

.palette {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  padding: 4px 0;
}

.palette > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.swatch-wrap {
  position: relative;
  width: 28px;
  height: 22px;
}

/* A div, not a button: UXP gives buttons a native look that fights back. */
.swatch {
  width: 28px;
  height: 22px;
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  cursor: pointer;
  padding: 0;
}

.swatch-input {
  width: 66px;
  min-width: 66px;
  min-height: 20px;
  background: var(--bg-sunken);
  border: 1px solid var(--accent);
  border-radius: 2px;
  color: var(--text);
  font-size: 10px;
  padding: 0 3px;
  font-family: inherit;
  -webkit-user-select: text;
  user-select: text;
}

.swatch-lock {
  position: absolute;
  right: 2px;
  bottom: 1px;
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: #ffffff;
  border: 1px solid #000000;
}

.palette-actions {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  margin-top: 2px;
}

.palette-actions > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.hint {
  color: var(--text-faint);
  font-size: 9px;
  line-height: 1.4;
  padding: 2px 0 4px;
}

/* --------------------------------------------------------- presets */

.preset-bar {
  border-top: 1px solid var(--border);
  padding-top: 8px;
  display: flex;
  flex-direction: column;
}

.preset-row { margin-bottom: 5px; }

.preset-list {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
}

.preset-list > * {
  margin-right: 3px;
  margin-bottom: 3px;
}

.preset-chip {
  min-height: 20px;
  padding: 0 8px;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}

.preset-chip:hover { color: var(--text); border-color: var(--accent); }
.preset-chip.active {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}
.preset-chip.user { border-style: dashed; }

/* ---------------------------------------------------------- notice */

.notice {
  display: none;
  padding: 6px 8px;
  border-radius: var(--radius);
  font-size: 10px;
  line-height: 1.5;
  border: 1px solid var(--border);
  background: var(--bg-raised);
  color: var(--text-dim);
  -webkit-user-select: text;
  user-select: text;
}

.notice.show { display: block; }
.notice.error { border-color: var(--danger); color: var(--text); }
.notice.warn { border-color: #b8860b; }

</style>
</head>

      case "slider":
        ctl = C.createSlider(def, this.params[def.key], commit);
        break;
      case "choice":
        ctl = C.createChoice(def, this.params[def.key], commit);
        break;
      case "chips":
        // Only the dither algorithm list is grouped. Handing this grouping to
        // every chips control blanked the Shape row entirely: none of its
        // options belong to a dither family, so no group claimed them.
        ctl = C.createChipChoice(
          def,
          this.params[def.key],
          commit,
          def.key === "ditherAlgorithm"
            ? {
                labels: ALGORITHM_LABELS,
                groups: ALGORITHM_FAMILIES,
                groupOf: (id) => ALGORITHM_FAMILY_OF[id],
              }
            : {}
        );
        break;
      case "toggle":
        ctl = C.createToggle(def, this.params[def.key], commit);
        break;
      case "color":
        ctl = C.createColorField(def, this.params[def.key], commit, () => IM.foregroundRGB());
        break;
      case "palette":
        ctl = C.createPalette({
          value: this.params[def.key],
          locked: this.params.lockedSwatches,
          onChange: (hexes, lockedIdx) => {
            this.params.palette = hexes;
            this.params.lockedSwatches = lockedIdx || [];
            this.params.paletteLocked = true;
            if (this.controls.paletteLocked) this.controls.paletteLocked.set(true);
            this.params.colorCount = Math.min(8, Math.max(2, hexes.length));
            if (this.controls.colorCount) this.controls.colorCount.set(this.params.colorCount);
            this.onParamsChanged(true);
          },
          onExtract: () => this.extractPalette(),
          onImport: () => this.importPalette(),
          onExport: () => this.exportPalette(),
          getForeground: () => IM.foregroundRGB(),
        });
        break;
      default:
        ctl = { el: C.el("div"), set: () => {} };
    }
    this.controls[def.key] = ctl;
    return ctl.el;
  }

  bindButtons() {
    this.$("btn-load").addEventListener("click", () => this.loadLayer());
    this.$("btn-apply").addEventListener("click", () => this.apply());
    this.$("btn-update").addEventListener("click", () => this.update());
    this.$("btn-reset").addEventListener("click", () => this.resetAll());
    this.$("btn-batch").addEventListener("click", () => this.batchApply());
    this.bindCompare();
    this.$("btn-save-preset").addEventListener("click", () => this.savePreset());
    this.$("btn-load-preset").addEventListener("click", () => this.promptLoadPreset());
  }

  /* --------------------------------------------------- state changes */

  setParam(key, value, committed) {
    if (this.params[key] === value) {
      if (committed) this.onParamsChanged(true);
      return;
    }
    this.params[key] = value;
    this.activePresetId = null;

    // Changing the colour count only means something if the palette follows it.
    if (key === "colorCount" && this.params.paletteLocked) this.syncPaletteToCount();
    if (key === "paletteLocked" && !value) this.syncPaletteFromImage();
    if (this.affectsLayout(key)) {
      this.buildSections();
      this.syncControls();
    }

    this.onParamsChanged(committed);
  }

  onParamsChanged(committed) {
    this.renderPresetChips();
    this.schedulePreview();
    if (committed) this.persistSession();
  }

  syncPaletteToCount() {
    const count = this.params.colorCount;
    if (this.engine.hasSource()) {
      try {
        this.params.palette = this.mergeLocked(this.engine.extractPaletteHex(this.params));
      } catch (e) {
        this.params.palette = padHexes(this.params.palette, count);
      }
    } else {
      this.params.palette = padHexes(this.params.palette, count);
    }
    if (this.controls.palette) this.controls.palette.set(this.params.palette, this.params.lockedSwatches);
  }

  syncPaletteFromImage() {
    if (!this.engine.hasSource()) return;
    try {
      this.params.palette = this.mergeLocked(this.engine.extractPaletteHex(this.params));
      if (this.controls.palette) this.controls.palette.set(this.params.palette, this.params.lockedSwatches);
    } catch (e) {
      /* keep the current palette */
    }
  }

  /**
   * Re-extract, keeping any swatch the user pinned.
   *
   * The locked entries are put back at their own indices afterwards, so pinning
   * a brand colour and letting the engine choose the rest works as expected.
   */
  mergeLocked(extracted) {
    const locks = this.params.lockedSwatches || [];
    if (!locks.length) return extracted;
    const out = extracted.slice();
    for (const i of locks) {
      if (i < out.length && this.params.palette[i]) out[i] = this.params.palette[i];
    }
    return out;
  }

  extractPalette() {
    if (!this.engine.hasSource()) {
      this.notice("Load a layer first, then the palette can be read from its pixels.", "warn");
      return;
    }
    const fresh = this.engine.extractPaletteHex(this.params);
    this.params.palette = this.mergeLocked(fresh);
    this.params.paletteLocked = true;
    if (this.controls.palette) this.controls.palette.set(this.params.palette, this.params.lockedSwatches);
    if (this.controls.paletteLocked) this.controls.paletteLocked.set(true);
    this.onParamsChanged(true);
    const kept = (this.params.lockedSwatches || []).length;
    this.notice(
      `Extracted ${this.params.palette.length} colours` + (kept ? `, keeping ${kept} locked.` : ".")
    );
  }

  async importPalette() {
    await this.guard("Importing swatches…", async () => {
      const res = await SWATCH.importPalette();
      if (!res) return;
      const hexes = res.hexes.slice(0, 8);
      this.params.palette = hexes;
      this.params.colorCount = Math.max(2, Math.min(8, hexes.length));
      this.params.paletteLocked = true;
      this.params.lockedSwatches = [];
      this.rebuild();
      this.schedulePreview();
      this.notice(
        `Imported ${res.hexes.length} swatches from ${res.name}` +
          (res.hexes.length > 8 ? `, using the first 8.` : ".")
      );
    });
  }

  async exportPalette() {
    await this.guard("Exporting swatches…", async () => {
      const name = await SWATCH.exportPalette(this.params.palette, "ase");
      if (name) this.notice(`Palette written to ${name}.`);
    });
  }

  syncControls() {
    for (const def of PARAM_DEFS) {
      const c = this.controls[def.key];
      if (c && c.set) c.set(this.params[def.key]);
    }
  }

  /** Rebuild the whole panel from `this.params` (after a preset or a recall). */
  rebuild() {
    this.buildSections();
    this.syncControls();
    this.renderPresetChips();
  }

  resetAll() {
    this.params = defaultParams();
    this.activePresetId = null;
    this.rebuild();
    this.schedulePreview();
    this.persistSession();
    this.notice("All parameters reset to defaults.");
  }

  /* ------------------------------------------------------- previewing */

  schedulePreview() {
    if (!this.engine.hasSource()) return;
    if (this.lastFrameMs > SLOW_FRAME_MS) {
      // The last frame overran; debounce instead of trying to keep up.
      if (this._timer) clearTimeout(this._timer);
      this._timer = setTimeout(() => {
        this._timer = null;
        this.drawPreview();
      }, DEBOUNCE_MS);
      return;
    }
    if (this._raf) return;
    const schedule =
      typeof requestAnimationFrame === "function" ? requestAnimationFrame : (fn) => setTimeout(fn, 16);
    this._raf = schedule(() => {
      this._raf = null;
      this.drawPreview();
    });
  }

  previewSize() {
    const src = this.engine.source;
    const wrap = this.$("preview-wrap");
    const avail = Math.max(160, Math.min(PREVIEW_MAX, (wrap && wrap.clientWidth) || PREVIEW_MAX));
    const scale = Math.min(1, avail / src.width);
    return {
      width: Math.max(1, Math.round(src.width * scale)),
      height: Math.max(1, Math.round(src.height * scale)),
    };
  }

  drawPreview() {
    if (!this.engine.hasSource()) return;
    const t0 = Date.now();
    try {
      const size = this.previewSize();
      const out = this.engine.render(
        this.params,
        Object.assign({ maxDitherGrid: PREVIEW_DITHER_GRID }, size)
      );
      this.$("preview").src = toDataURL(out.data, out.width, out.height);
      this.$("preview").className = "preview visible";
      this.$("preview-empty").className = "preview-empty hidden";
      this.lastFrameMs = Date.now() - t0;
      const unit = this.params.mode === "dither" ? "px" : "cells";
      const screens = out.angles ? ` · ${out.angles.length} screens @ ${out.angles.join("/")}°` : "";
      this._lastBadge =
        `${this.engine.stats.cells || 0} ${unit}${screens} · ${this.lastFrameMs}ms` +
        (out.exact ? "" : " · approx");
      this.$("preview-badge").textContent = this._lastBadge;
    } catch (e) {
      this.lastFrameMs = Date.now() - t0;
      this.notice(`Preview failed: ${e.message}`, "error");
    }
  }

  /* --------------------------------------------------- Photoshop ops */

  async loadLayer() {
    await this.guard("Loading layer…", async () => {
      const src = await RENDER.readSource();
      this.engine.setSource(src.image);
      this.engine.sourceLayerId = src.layerId;
      this.engine.docPPI = src.docPPI || 72;
      this.sourceInfo = src;
      if (!this.params.paletteLocked) this.syncPaletteFromImage();
      this.drawPreview();

      // If this layer is an existing render, bring its settings back.
      const recalled = await RENDER.recallParams();
      if (recalled) {
        this.params = sanitizeParams(recalled.params);
        this.rebuild();
        this.drawPreview();
        this.notice(
          `Loaded "${src.layerName}" and restored the settings of ${recalled.renderId} (from ${recalled.source}).`
        );
      } else {
        this.notice(
          `Loaded "${src.layerName}" at ${src.image.width}x${src.image.height} for previewing.`
        );
      }
      this.refreshContext();
    });
  }

  async apply() {
    if (!this.engine.hasSource()) {
      await this.loadLayer();
      if (!this.engine.hasSource()) return;
    }
    await this.guard("Applying…", async () => {
      const res = await RENDER.applyNew(this.engine, this.params, {
        onProgress: (t) => this.progress(t),
      });
      this.reportPersistence(res);
      this.refreshContext();
    });
  }

  async update() {
    await this.guard("Updating…", async () => {
      const res = await RENDER.updateExisting(this.engine, this.params, {
        onProgress: (t) => this.progress(t),
      });
      this.reportPersistence(res);
      this.drawPreview();
      this.refreshContext();
    });
  }

  reportPersistence(res) {
    const where = res.persistence.xmp
      ? "with the layer"
      : res.persistence.sidecar
        ? "in the plugin's data folder (this Photoshop install only)"
        : "nowhere - persistence failed";
    const verb = res.updated ? "Updated" : "Created";
    const fellBack = this.params.output === "separated" && res.outputMode !== "separated";
    this.notice(
      `${verb} ${res.renderId} at ${res.width}x${res.height} (${res.outputMode}). ` +
        `Settings saved ${where}.` +
        (res.note ? ` ${res.note}` : ""),
      fellBack || !(res.persistence.xmp || res.persistence.sidecar) ? "warn" : ""
    );
  }

  /* ----------------------------------------------------------- batch */

  async batchApply() {
    const preview = BATCH.previewBatch(this.params.batchScope);
    if (!preview.count) {
      this.notice(preview.message, "warn");
      return;
    }
    this._cancelBatch = false;
    await this.guard(`Batching ${preview.count} layers…`, async () => {
      const res = await BATCH.runBatch(this.engine, this.params, {
        scope: this.params.batchScope,
        sharedPalette: this.params.batchSharedPalette,
        onItem: (i, total, name) => this.status(`Batch ${i + 1}/${total}: ${name}`, "busy"),
        onProgress: (t) => this.progress(t),
        shouldCancel: () => this._cancelBatch,
      });

      // The engine now holds the last batched layer, not what the panel was
      // previewing, so drop the stale preview rather than showing a lie.
      this.engine.sourceLayerId = null;

      const parts = [`Batched ${res.done} of ${res.total} layers.`];
      if (res.palette) parts.push(`Shared palette: ${res.palette.join(" ")}.`);
      if (res.cancelled) parts.push("Cancelled before the end.");
      if (res.failures.length) {
        parts.push(
          `${res.failures.length} failed: ` +
            res.failures.map((f) => `${f.name} (${f.error})`).join("; ")
        );
      }
      this.notice(parts.join(" "), res.failures.length || res.cancelled ? "warn" : "");
    });
  }

  /* --------------------------------------------------------- compare */

  /**
   * Hold the Compare button to swap the preview for the untouched source.
   * Cheaper and less error-prone than a toggle: you cannot leave it stuck on.
   */
  bindCompare() {
    const btn = this.$("btn-compare");
    if (!btn) return;
    const show = () => {
      if (!this.engine.hasSource()) return;
      const img = this.$("preview");
      this._renderedSrc = img.src;
      img.src = this.sourceDataURL();
      this.$("preview-badge").textContent = "original";
    };
    const hide = () => {
      if (!this._renderedSrc) return;
      // Restore rather than re-render: nothing can have changed while the
      // button was held, and a re-render would race a pending preview tick.
      this.$("preview").src = this._renderedSrc;
      this._renderedSrc = null;
      this.$("preview-badge").textContent = this._lastBadge || "";
    };
    btn.addEventListener("pointerdown", show);
    btn.addEventListener("pointerup", hide);
    btn.addEventListener("pointercancel", hide);
    btn.addEventListener("pointerleave", hide);
  }

  /** The source, downscaled to preview size and cached. */
  sourceDataURL() {
    const size = this.previewSize();
    const key = `${this.engine.sourceId}|${size.width}x${size.height}`;
    if (this._sourceURL && this._sourceURL.key === key) return this._sourceURL.url;
    const small = downscale(this.engine.source, size.width, size.height);
    const url = toDataURL(small.data, small.width, small.height);
    this._sourceURL = { key, url };
    return url;
  }

  /* ------------------------------------------------------- selection */

  watchSelection() {
    try {
      HOST.action().addNotificationListener(
        [{ event: "select" }, { event: "delete" }, { event: "make" }],
        () => {
          if (this._selectionTimer) clearTimeout(this._selectionTimer);
          this._selectionTimer = setTimeout(() => this.refreshContext(), 120);
        }
      );
    } catch (e) {
      // Without the listener the panel simply does not auto-refresh; the user
      // can still press Load Layer. Not worth failing over.
    }
  }

  refreshContext() {
    let ctx;
    try {
      ctx = RENDER.currentContext();
    } catch (e) {
      this.status(e.message, "error");
      return;
    }

    const update = this.$("btn-update");
    if (ctx.mode === "existing") {
      update.removeAttribute("disabled");
      this.status(`Halftone group ${ctx.renderId || ""} selected — Update re-renders it.`, "ready");
    } else if (ctx.mode === "new") {
      update.setAttribute("disabled", "true");
      this.status(`"${ctx.targetLayer.name}" selected — Apply creates a new halftone.`, "ready");
    } else {
      update.setAttribute("disabled", "true");
      this.status(ctx.message, "");
    }
  }

  /* --------------------------------------------------------- presets */

  allPresets() {
    return BUILTIN_PRESETS.concat(this.userPresets);
  }

  renderPresetChips() {
    const host = this.$("preset-list");
    if (!host) return;
    host.textContent = "";
    for (const preset of this.allPresets()) {
      const chip = C.el(
        "button",
        "preset-chip" +
          (preset.user ? " user" : "") +
          (preset.id === this.activePresetId ? " active" : ""),
        preset.name
      );
      chip.addEventListener("click", (e) => {
        if (e.altKey && preset.user) {
          this.deletePreset(preset);
          return;
        }
        this.applyPreset(preset);
      });
      if (preset.user) chip.title = `${preset.name} — alt-click to delete`;
      host.appendChild(chip);
    }
  }

  applyPreset(preset) {
    this.params = presetToParams(preset);
    this.activePresetId = preset.id;
    if (!this.params.paletteLocked) this.syncPaletteFromImage();
    this.rebuild();
    this.schedulePreview();
    this.persistSession();
    this.notice(`Preset "${preset.name}" loaded.`);
  }

  async deletePreset(preset) {
    this.userPresets = this.userPresets.filter((p) => p.id !== preset.id);
    if (this.activePresetId === preset.id) this.activePresetId = null;
    const saved = await META.saveUserPresets(this.userPresets);
    this.renderPresetChips();
    this.notice(
      saved ? `Preset "${preset.name}" deleted.` : `Preset "${preset.name}" removed for this session only.`,
      saved ? "" : "warn"
    );
  }

  async savePreset() {
    const name = await this.promptText("Preset name", "My Halftone");
    if (!name) return;
    const preset = makeUserPreset(name, this.params);
    this.userPresets = this.userPresets.filter((p) => p.name !== preset.name).concat([preset]);
    const saved = await META.saveUserPresets(this.userPresets);
    this.activePresetId = preset.id;
    this.renderPresetChips();
    this.notice(
      saved
        ? `Preset "${preset.name}" saved.`
        : `Preset "${preset.name}" is active but could not be written to disk.`,
      saved ? "" : "warn"
    );
  }

  async promptLoadPreset() {
    // The chips are the picker; this button just makes that discoverable and
    // handles the "I have too many presets to scan" case.
    const names = this.allPresets().map((p) => p.name);
    const name = await this.promptText(`Load preset (${names.join(", ")})`, names[0] || "");
    if (!name) return;
    const found = this.allPresets().find(
      (p) => p.name.toLowerCase() === String(name).trim().toLowerCase()
    );
    if (!found) {
      this.notice(`No preset named "${name}".`, "warn");
      return;
    }
    this.applyPreset(found);
  }

  /**
   * A small modal text prompt. `window.prompt` does not exist in UXP, so the
   * panel builds its own inline field.
   */
  promptText(label, initial) {
    return new Promise((resolve) => {
      const notice = this.$("notice");
      notice.textContent = "";
      notice.className = "notice show";
      const row = C.el("div", "ctl");
      row.appendChild(C.el("div", "ctl-label", label));
      const input = C.el("input", "ctl-value");
      input.type = "text";
      input.style.textAlign = "left";
      input.style.width = "120px";
      input.style.minWidth = "80px";
      input.style.flexGrow = "1";
      input.style.flexShrink = "1";
      input.value = initial || "";
      const okBtn = C.el("button", "seg-item", "OK");
      okBtn.style.width = "38px";
      okBtn.style.minWidth = "38px";
      okBtn.style.flexGrow = "0";
      okBtn.style.flexShrink = "0";
      const cancelBtn = C.el("button", "seg-item", "Cancel");
      cancelBtn.style.width = "50px";
      cancelBtn.style.minWidth = "50px";
      cancelBtn.style.flexGrow = "0";
      cancelBtn.style.flexShrink = "0";
      row.appendChild(input);
      row.appendChild(okBtn);
      row.appendChild(cancelBtn);
      notice.appendChild(row);
      input.focus();
      if (input.select) input.select();

      const done = (value) => {
        notice.textContent = "";
        notice.className = "notice";
        resolve(value);
      };
      okBtn.addEventListener("click", () => done(input.value.trim() || null));
      cancelBtn.addEventListener("click", () => done(null));
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") done(input.value.trim() || null);
        else if (e.key === "Escape") done(null);
      });
    });
  }

  /* ----------------------------------------------------------- misc */

  async persistSession() {
    try {
      await META.saveSession(this.params);
    } catch (e) {
      /* best effort */
    }
  }

  /**
   * Run an async Photoshop operation with busy state, progress and a single
   * place where errors turn into a readable message.
   */
  async guard(label, fn) {
    if (this._busy) return;
    this._busy = true;
    this.setButtonsEnabled(false);
    this.status(label, "busy");
    this.progress(0, true);
    try {
      await fn();
      this.status("Ready", "ready");
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      this.notice(msg, "error");
      this.status(msg, "error");
    } finally {
      this._busy = false;
      this.setButtonsEnabled(true);
      this.progress(0, false);
      this.refreshContext();
    }
  }

  setButtonsEnabled(enabled) {
    for (const id of [
      "btn-load",
      "btn-apply",
      "btn-update",
      "btn-reset",
      "btn-batch",
      "btn-save-preset",
      "btn-load-preset",
    ]) {
      const b = this.$(id);
      if (!b) continue;
      if (enabled) b.removeAttribute("disabled");
      else b.setAttribute("disabled", "true");
    }
  }

  status(text, kind) {
    this.$("status-text").textContent = text;
    this.$("status-dot").className = "status-dot" + (kind ? " " + kind : "");
  }

  progress(t, active) {
    const wrap = this.$("progress");
    const bar = this.$("progress-bar");
    if (active !== undefined) wrap.className = "progress" + (active ? " active" : "");
    bar.style.width = Math.round(Math.max(0, Math.min(1, t)) * 100) + "%";
  }

  notice(text, kind) {
    const n = this.$("notice");
    n.textContent = text;
    n.className = "notice show" + (kind ? " " + kind : "");
  }
}

const ALGORITHM_LABELS = {};
const ALGORITHM_FAMILY_OF = {};
for (const a of ALGORITHMS) {
  ALGORITHM_LABELS[a.id] = a.label;
  ALGORITHM_FAMILY_OF[a.id] = a.family;
}

function padHexes(hexes, count) {
  const out = (hexes || []).slice(0, count);
  while (out.length < count) out.push(out.length ? out[out.length - 1] : "#808080");
  return out;
}

module.exports = { Panel };

});

</script>
<script>
(function () {
  var Panel = window.__require("main.js", "./src/ui/panel.js").Panel;
  var panel = new Panel(document);
  window.halftonePanel = panel;
  panel.init().catch(function (e) {
    var n = document.getElementById("notice");
    if (n) { n.textContent = String(e && e.message || e); n.className = "notice show error"; }
    if (window.console) console.error(e);
  });
})();
</script>

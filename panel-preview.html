<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halftone Studio — panel preview</title>
<style>
/*
 * Halftone Studio panel styling.
 *
 * DIRECTION: "noir editorial". Near-black, strictly flat surfaces; hierarchy
 * comes from a step in background luminance and a 1px rule, never from a shadow.
 * Titles are capitals with wide letter-spacing against lower-case body text at
 * the same size, so the contrast is casing and spacing rather than scale. One
 * accent - a deep red - rationed to the primary action and to live state, never
 * used as a large flat area.
 *
 * PROVENANCE: this direction was proposed rather than sampled. omerta.fr, the
 * reference, blocks automated access (robots.txt), so nothing here is measured
 * from that site; it is a coherent art direction in the same register, tuned
 * contrast-first for an 11px panel. Every value lives in the tokens below, so
 * recalibrating against real screenshots is a token edit and nothing more.
 *
 * WRITTEN FOR UXP, NOT FOR A BROWSER
 * ----------------------------------
 * UXP's CSS engine is a subset, and the gaps are not the ones you would guess.
 * Four rules here exist because the obvious version rendered as a pile of
 * overlapping controls:
 *
 *  1. NO `gap`. Flex gap is ignored, so every space is an explicit margin.
 *     Without this, controls sit flush against each other.
 *
 *  2. NO fixed `height` on anything containing a form control. UXP's native
 *     input is taller than a text line, so a 22px row let its input overflow
 *     into the row below. Everything uses `min-height`.
 *
 *  3. INPUTS GET AN EXPLICIT `width`, never just a flex basis. A UXP text input
 *     asserts its own intrinsic width and wins against `flex: 0 0 46px`, which
 *     is what collapsed every slider to nothing and stretched the number field
 *     across the panel.
 *
 *  4. NO `::before` / `::after`. Pseudo-elements do not render, so anything they
 *     would have drawn (the disclosure caret, the brand mark, the tick beside a
 *     bar label) is a real element with real content in it.
 *
 * Flex longhand is used throughout rather than the shorthand, for the same
 * reason: it is the form UXP handles predictably.
 *
 * NOTHING HERE NEEDS TO DEGRADE
 * -----------------------------
 * The previous revision leaned on gradients and glows and had to be built so
 * that UXP dropping them cost nothing. This direction is flat by intent: no
 * gradients, no shadows, no glows anywhere. That removes the failure mode
 * rather than handling it - there is no decoration left for UXP to ignore.
 *
 * TWO REDS, TOLD APART BY FORM
 * ----------------------------
 * `--accent` and `--danger` are both red and at 10px are indistinguishable by
 * hue. They are separated by shape instead, and the rule is absolute: the
 * accent appears ONLY as a filled area, and an error appears ONLY as text with
 * a 1px rule and a tinted background, never filled. A third token,
 * `--accent-on-dark-text`, exists because the accent red only reaches 3.35:1 on
 * the dark background - fine behind white text, illegible as text itself - so
 * red *text* uses the lighter value.
 */

:root {
  --bg: #0b0b0c;
  --bg-raised: #16161a;
  --bg-raised-hi: #1f1f24;
  --bg-sunken: #070709;
  --border: #2a2a30;
  --border-strong: #3e3e46;
  --text: #f2f1ee;
  --text-dim: #a5a4a0;
  --text-faint: #858480;
  --accent: #c8102e;
  --accent-2: #c9a227;
  --accent-hi: #e11836;
  --accent-soft: #2a1116;
  --accent-text: #ffffff;
  /* The accent is only 3.35:1 on --bg, so red *text* uses this instead. */
  --accent-on-dark-text: #ff3b52;
  --track: #2a2a30;
  --fill: #55555e;
  --danger: #ff6b6b;
  --warn: #e8a33d;
  --ok: #3dd68c;
  --radius: 4px;
  --radius-sm: 2px;
  --font-ui: "Adobe Clean", -apple-system, "Segoe UI Variable Text", "Segoe UI",
    "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display: "Adobe Clean", -apple-system, "Segoe UI Variable Display",
    "Segoe UI Semibold", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
}

/*
 * The light theme is the same composition in daylight. The accent darkens
 * rather than lightens - on white, a hover that gets brighter reads as fading -
 * and `--accent-on-dark-text` collapses back onto the accent because the
 * contrast problem it solves does not exist here.
 */
@media (prefers-color-scheme: light) {
  :root {
    --bg: #fbfaf8;
    --bg-raised: #ffffff;
    --bg-raised-hi: #f2f0ec;
    --bg-sunken: #edebe6;
    --border: #dcd9d2;
    --border-strong: #b9b5ac;
    --text: #111112;
    --text-dim: #55534e;
    --text-faint: #7c7a74;
    --accent: #a50e26;
    --accent-2: #8a6b12;
    --accent-hi: #8a0b1f;
    --accent-soft: #fbebee;
    --accent-text: #ffffff;
    --accent-on-dark-text: #a50e26;
    --track: #dcd9d2;
    --fill: #8a8781;
    --danger: #b3261e;
    --warn: #8a5a00;
    --ok: #146b3a;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 11px;
  -webkit-user-select: none;
  user-select: none;
}

/*
 * THE FROZEN HEAD AND THE SCROLLING BODY
 *
 * `#app` fills the panel and does not scroll. It holds exactly two children:
 *
 *   #head    the brand, the preview, the status line and the action buttons.
 *            Never scrolls, so the preview is on screen the whole time you are
 *            working through the controls. A slider you cannot see the effect
 *            of is not a slider you can use.
 *   #scroll  everything else. Takes whatever height is left and scrolls it.
 *
 * A UXP panel does not scroll its document for you, so the scrolling region has
 * to be an element with a definite height and its own overflow. `#app` gets that
 * height from the four insets, which pin it to the initial containing block -
 * the panel viewport - rather than depending on an unbroken height:100% chain
 * through html and body, which silently does nothing the moment one ancestor
 * forgets it. `#scroll` then takes the remainder with flex-grow.
 *
 * `min-height: 0` on `#scroll` is for Chromium, not for UXP: a browser gives
 * flex items an automatic minimum size, which would stop it shrinking below its
 * content and so stop it ever scrolling. UXP does not implement that minimum,
 * so there it is already free to shrink. Stating it explicitly makes the two
 * engines agree - which is exactly what the layout test needs in order to mean
 * anything.
 */
#app {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 11px;
  background-color: var(--bg);
}

#head {
  flex-grow: 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  /* A hard rule, so a control clipped at the top of the list reads as scrolled
     under the head rather than as a rendering fault. */
  border-bottom: 1px solid var(--border-strong);
  padding-bottom: 12px;
}

#scroll {
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  /* Room for the scrollbar, so it never sits on top of a control. */
  padding-right: 2px;
  padding-top: 14px;
}

/*
 * Nothing inside either region may be compressed.
 *
 * Both are column flex containers with a definite height, so by default every
 * child is shrinkable - and they were shrunk, squeezing each section down and
 * clipping its rows against `overflow: hidden`. Worse, UXP paints native inputs
 * in a layer that ignores that clip, so the sliders vanished while their number
 * fields floated loose over the next section.
 *
 * A browser hides this: CSS gives flex items an automatic minimum size, so they
 * refuse to shrink below their content. UXP does not implement that, so the
 * floor has to be stated. With shrinking off, content simply overflows and
 * `#scroll` scrolls, which is the whole point of it.
 */
#head > *,
#scroll > * {
  margin-bottom: 10px;
  flex-shrink: 0;
}

/* The head's own padding provides the gap; a trailing margin would double it. */
#head > *:last-child { margin-bottom: 0; }

/* Air between blocks, per the direction: generous vertically, tight inside. */
#scroll > .preset-bar { margin-top: 6px; }

/* ------------------------------------------------------------ brand */

.brand {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 22px;
  margin-bottom: 10px;
}

/*
 * The mark is a four-dot halftone ramp: the plugin's whole idea in 18 pixels.
 * Four real divs, because pseudo-elements do not render here.
 */
.brand-mark {
  position: relative;
  width: 18px;
  height: 18px;
  min-width: 18px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 10px;
  background-color: var(--accent);
}

.brand-dot {
  position: absolute;
  border-radius: 50%;
  background-color: var(--bg);
}

.brand-dot-1 { width: 7px; height: 7px; left: 2px; top: 2px; }
.brand-dot-2 { width: 5px; height: 5px; left: 11px; top: 3px; }
.brand-dot-3 { width: 5px; height: 5px; left: 3px; top: 11px; }
.brand-dot-4 { width: 3px; height: 3px; left: 12px; top: 12px; }

.brand-name {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-family: var(--font-display);
}

/* Panel title: capitals at 0.12em, per the direction's spacing table. */
.brand-name-a {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--text);
}

.brand-name-b {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  margin-left: 6px;
}

/* Says which engine is running without opening the Mode section. */
.brand-mode {
  flex-grow: 0;
  flex-shrink: 0;
  min-height: 17px;
  padding: 1px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background-color: var(--bg-raised);
  color: var(--text-dim);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* A rule, which in this direction is the structural device, not a decoration. */
.rule {
  min-height: 1px;
  height: 1px;
  margin-bottom: 12px;
  background-color: var(--border);
}

/* ----------------------------------------------------------- status */

.status {
  display: flex;
  flex-direction: row;
  align-items: center;
  color: var(--text-dim);
  font-size: 10px;
  min-height: 14px;
  margin-bottom: 10px;
}

.status-dot {
  width: 6px;
  height: 6px;
  min-width: 6px;
  border-radius: 50%;
  background-color: var(--text-faint);
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 8px;
}

.status-dot.ready { background-color: var(--ok); }
.status-dot.busy { background-color: var(--accent-on-dark-text); }
.status-dot.error { background-color: var(--danger); }

#status-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
}

/* ---------------------------------------------------------- preview */

.preview-wrap {
  position: relative;
  flex-shrink: 0;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  min-height: 112px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 0;
}

/*
 * The frame may be rasterised for a larger detached window than this box, so
 * both maxima are needed. With width and height both auto, the two constraints
 * are applied proportionally and the aspect ratio survives.
 */
.preview {
  display: none;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
}

.preview.visible { display: block; }

.preview-empty {
  color: var(--text-faint);
  font-size: 10px;
  text-align: center;
  padding: 26px 16px;
  line-height: 1.8;
}

.preview-empty b {
  color: var(--text-dim);
  font-weight: 600;
}

.preview-empty.hidden { display: none; }

/*
 * Hidden until it has something to say. `:empty` would do this in a browser but
 * is not worth relying on here, so the panel toggles the class.
 */
.preview-badge { display: none; }

.preview-badge.show {
  display: block;
  position: absolute;
  right: 6px;
  bottom: 6px;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

/*
 * Split compare.
 *
 * The original sits on top of the render, clipped to the left of a draggable
 * handle. Both halves are the same frame at the same scale, so the seam runs
 * straight through whatever you are looking at - which is the whole point, and
 * what a hold-to-swap button cannot do: you cannot compare two things you never
 * see at the same time.
 *
 * Clipping is a wrapper with `overflow: hidden` and a width, not `clip-path`,
 * which UXP does not implement.
 */
.split { display: none; }

.split.show {
  display: block;
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
}

.split-clip {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 50%;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

/*
 * The image inside a clip that is narrower than the box must not be re-centred
 * by the flex layout, or the two halves would show different parts of the
 * picture and the comparison would be a lie. It is pinned to the box's own
 * geometry instead.
 */
.split-img {
  position: absolute;
  top: 0;
  left: 0;
  max-width: none;
  max-height: none;
}

.split-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 13px;
  margin-left: -6px;
  cursor: ew-resize;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

.split-grip {
  width: 1px;
  height: 100%;
  background-color: var(--accent);
}

.split-handle:hover .split-grip,
.split.dragging .split-grip {
  width: 3px;
  background-color: var(--accent-hi);
}

/* Drag to resize the preview; double-click to go back to automatic. */
.preview-grip {
  min-height: 11px;
  height: 11px;
  margin-bottom: 10px;
  cursor: ns-resize;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

.grip-line {
  width: 36px;
  height: 2px;
  min-height: 2px;
  border-radius: 1px;
  background-color: var(--border-strong);
}

.preview-grip:hover .grip-line { background-color: var(--text-faint); }
.preview-grip.dragging .grip-line { background-color: var(--accent-on-dark-text); }

/*
 * Zoom bar.
 *
 * The preview used to be a thumbnail of the whole document, which on a 6000px
 * image puts a halftone dot at a third of a screen pixel - you could not see
 * what you were about to commit to. 1:1 is the point of this row.
 */
.zoombar {
  display: flex;
  flex-direction: row;
  align-items: center;
  margin-bottom: 10px;
}

.zoombar > * {
  margin-right: 5px;
}

.zoombar > *:last-child { margin-right: 0; }

.zoom-btn {
  min-height: 20px;
  min-width: 24px;
  flex-grow: 0;
  flex-shrink: 0;
  padding: 0 6px;
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-family: var(--font-ui);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
}

.zoom-btn:hover { color: var(--text); border-color: var(--border-strong); }

.zoom-word {
  min-width: 34px;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.zoom-btn.active {
  background-color: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.zoom-level {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Dragging inside the preview pans it, once there is something to pan. */
.preview-wrap.pannable { cursor: grab; }
.preview-wrap.panning { cursor: grabbing; }

/* --------------------------------------------------------- controls */

.actions {
  display: flex;
  flex-direction: column;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background-color: var(--bg-raised);
}

/*
 * The output mode, at the point of decision. It was only in the Output section -
 * correct, and invisible: a user asked for a feature that had been shipped for
 * weeks because it was three collapsed sections down from the button it governs.
 */
.output-mode {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 24px;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.output-mode .ctl { flex-grow: 1; flex-shrink: 1; min-width: 0; min-height: 22px; }

.output-mode .ctl-label {
  width: 62px;
  min-width: 62px;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.toolbar {
  display: flex;
  flex-direction: row;
  align-items: stretch;
}

.toolbar > * {
  margin-right: 6px;
}

.toolbar > *:last-child { margin-right: 0; }

.toolbar-tail { margin-top: 6px; }

/*
 * Outline by default, filled only for the primary action - the direction is
 * explicit that two filled buttons never sit side by side. Capitals at 0.08em,
 * per its spacing table.
 */
.btn {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  min-height: 26px;
  padding: 0 6px;
  background-color: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-family: var(--font-ui);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn:hover {
  border-color: var(--text-dim);
  color: var(--text);
}

.btn:active { background-color: var(--bg-raised-hi); }

.btn[disabled] {
  opacity: 0.34;
  cursor: default;
  border-color: var(--border);
}

.btn[disabled]:hover {
  border-color: var(--border);
  color: var(--text);
}

.btn-primary {
  background-color: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.btn-primary:hover {
  background-color: var(--accent-hi);
  border-color: var(--accent-hi);
  color: var(--accent-text);
}

.btn-small {
  min-height: 22px;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  border-color: var(--border);
}

.btn-small:hover { border-color: var(--border-strong); }

/*
 * Only on screen while something is running that can actually be stopped, so
 * it never offers a promise it cannot keep. The panel toggles the class.
 *
 * Outline and text, never filled: the direction reserves flat red for the
 * accent, and an error or a stop is told apart from it by form rather than hue.
 */
.btn-cancel { display: none; }

.btn-cancel.show {
  display: block;
  color: var(--accent-on-dark-text);
  border-color: var(--accent-on-dark-text);
  background-color: var(--accent-soft);
}

.btn-cancel.show:hover {
  color: var(--accent-on-dark-text);
  border-color: var(--accent-on-dark-text);
}

/* A parent row with nothing visible in it must not leave a gap behind. */
.toolbar-hidden { display: none; }

.progress {
  min-height: 2px;
  height: 2px;
  background-color: var(--track);
  overflow: hidden;
  opacity: 0;
  margin-bottom: 10px;
}

.progress.active { opacity: 1; }

.progress-bar {
  height: 2px;
  width: 0%;
  background-color: var(--accent);
}

/* --------------------------------------------------------- sections */

.sections {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/*
 * The accent rail is the left border rather than an extra element: one property
 * to light up, no absolute positioning, and `box-sizing: border-box` keeps the
 * width identical open or closed so nothing shifts when a section expands.
 */
.section {
  border: 1px solid var(--border);
  border-left: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: var(--bg-raised);
  margin-bottom: 5px;
  flex-shrink: 0;
  overflow: hidden;
}

.section.open {
  border-color: var(--border-strong);
  border-left-color: var(--accent);
}

.section-head {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 8px 11px;
  cursor: pointer;
  min-height: 23px;
}

.section-head:hover { background-color: var(--bg-raised-hi); }

/* A real glyph, because pseudo-elements and CSS triangles both fail in UXP. */
.section-caret {
  width: 9px;
  min-width: 9px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 9px;
  font-size: 7px;
  line-height: 1;
  color: var(--text-faint);
}

.section.open .section-caret { color: var(--accent-on-dark-text); }

/* Section label: capitals at 0.18em, the widest step in the spacing table. */
.section-title {
  flex-grow: 0;
  flex-shrink: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.section.open .section-title { color: var(--text); }
.section-head:hover .section-title { color: var(--text); }

/*
 * The collapsed section's readout. Monospace, right-aligned, dim, and allowed
 * to be cut off: it is a reminder, never the only way to see a value.
 */
.section-summary {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  margin-left: 10px;
  text-align: right;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* An open section shows the real controls; repeating them in the head is noise. */
.section.open .section-summary { display: none; }

.section-body {
  display: none;
  padding: 4px 11px 10px;
  border-top: 1px solid var(--border);
  background-color: var(--bg-raised);
}

.section.open .section-body { display: block; }

/* ----------------------------------------------------------- slider */

.ctl {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 28px;
  flex-shrink: 0;
}

.ctl > * {
  margin-right: 8px;
}

.ctl > *:last-child { margin-right: 0; }

/* Body text: lower case, no letter-spacing at all, per the direction. */
.ctl-label {
  width: 64px;
  min-width: 64px;
  flex-grow: 0;
  flex-shrink: 0;
  color: var(--text-dim);
  letter-spacing: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ctl-label.modified { color: var(--text); }

.slider {
  position: relative;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 30px;
  min-height: 22px;
  display: flex;
  flex-direction: row;
  align-items: center;
  cursor: ew-resize;
}

.slider-track {
  position: relative;
  width: 100%;
  height: 2px;
  min-height: 2px;
  background-color: var(--track);
}

.slider-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  background-color: var(--fill);
}

/* Only a moved slider takes the accent: colour marks state, it does not decorate. */
.ctl.modified .slider-fill { background-color: var(--accent); }

.slider-thumb {
  position: absolute;
  top: -4px;
  width: 10px;
  height: 10px;
  margin-left: -5px;
  border-radius: 50%;
  background-color: var(--text);
  border: 1px solid var(--bg);
}

.slider:hover .slider-thumb { background-color: var(--accent-on-dark-text); }
.slider.dragging .slider-thumb { background-color: var(--accent); }

/*
 * Explicit width: a UXP input asserts its own and would eat the slider.
 * Monospace, so the numbers stop dancing as they change - this is a readout.
 */
.ctl-value {
  width: 66px;
  min-width: 66px;
  flex-grow: 0;
  flex-shrink: 0;
  min-height: 22px;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 10px;
  text-align: right;
  padding: 0 6px;
  -webkit-user-select: text;
  user-select: text;
}

.ctl.modified .ctl-value { color: var(--text); border-color: var(--border-strong); }
.ctl-value:hover { border-color: var(--border-strong); }
/* Focus is a 1px accent rule, not a halo: the direction allows no shadows. */
.ctl-value:focus { border-color: var(--accent-on-dark-text); }

.ctl-reset {
  width: 14px;
  min-width: 14px;
  flex-grow: 0;
  flex-shrink: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  font-family: inherit;
  margin-right: 0;
  visibility: hidden;
}

.ctl.modified .ctl-reset { visibility: visible; }
.ctl-reset:hover { color: var(--accent-on-dark-text); }

/* ----------------------------------------------------- segmented set */

.seg {
  display: flex;
  flex-direction: row;
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background-color: var(--bg-sunken);
}

.seg-item {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  min-height: 22px;
  text-align: center;
  background-color: transparent;
  color: var(--text-dim);
  border: 0;
  border-right: 1px solid var(--border);
  font-size: 9px;
  font-family: var(--font-ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 0 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.seg-item:last-child { border-right: 0; }

.seg-item.active {
  background-color: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.seg-item:hover { color: var(--text); background-color: var(--bg-raised-hi); }
.seg-item.active:hover { color: var(--accent-text); background-color: var(--accent-hi); }

/* ------------------------------------------------------------ chips */

.chip-row {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.chip-row > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.chip-group-label {
  color: var(--text-faint);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin-top: 6px;
  margin-bottom: 4px;
}

/* Squared off: the direction rules out pills, which break the register. */
.algo-chip {
  min-height: 21px;
  padding: 0 8px;
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: var(--font-ui);
  white-space: nowrap;
}

.algo-chip:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.algo-chip.active {
  background-color: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
  font-weight: 600;
}

/* --------------------------------------------------------- toggle */

.toggle {
  width: 32px;
  min-width: 32px;
  height: 18px;
  min-height: 18px;
  flex-grow: 0;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
  background-color: var(--bg-sunken);
  border: 1px solid var(--border-strong);
  position: relative;
  cursor: pointer;
  padding: 0;
}

.toggle:hover { border-color: var(--text-faint); }

.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background-color: var(--text-faint);
}

.toggle.on {
  background-color: var(--accent);
  border-color: var(--accent);
}

.toggle.on .toggle-knob {
  left: 16px;
  background-color: var(--accent-text);
}

/* -------------------------------------------------------- palette */

.palette {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  padding: 6px 0 2px;
}

.palette > * {
  margin-right: 5px;
  margin-bottom: 5px;
}

.swatch-wrap {
  position: relative;
  width: 32px;
  height: 26px;
}

/* A div, not a button: UXP gives buttons a native look that fights back. */
.swatch {
  width: 32px;
  height: 26px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  padding: 0;
}

.swatch:hover { border-color: var(--text); }

.swatch-input {
  width: 70px;
  min-width: 70px;
  min-height: 22px;
  background-color: var(--bg-sunken);
  border: 1px solid var(--accent-on-dark-text);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 10px;
  padding: 0 4px;
  -webkit-user-select: text;
  user-select: text;
}

/* The one place gold earns its keep: a pinned swatch is a "premium" detail. */
.swatch-lock {
  position: absolute;
  right: 2px;
  bottom: 2px;
  width: 7px;
  height: 7px;
  background-color: var(--accent-2);
  border: 1px solid var(--bg-sunken);
}

.palette-actions {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  margin-top: 3px;
}

.palette-actions > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.hint {
  color: var(--text-faint);
  font-size: 9px;
  line-height: 1.6;
  padding: 6px 0 2px;
  border-top: 1px solid var(--border);
  margin-top: 6px;
}

/* ------------------------------------------------------ tone curve */

/*
 * Drawn from positioned elements, not a canvas: UXP's canvas support varies by
 * host version. The box height is stated here AND in controls.js, because the
 * curve needs a number to position against before the box exists to measure.
 * If the two drift, the curve leaves its box - which the layout test catches.
 */
.curve {
  display: flex;
  flex-direction: column;
  padding: 2px 0 0;
}

.curve-head {
  display: flex;
  flex-direction: row;
  align-items: center;
  min-height: 22px;
  margin-bottom: 5px;
}

.curve-head > * { margin-right: 8px; }
.curve-head > *:last-child { margin-right: 0; }

.curve-readout {
  flex-grow: 1;
  flex-shrink: 1;
  min-width: 0;
  text-align: right;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-faint);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.curve.modified .curve-readout { color: var(--text-dim); }
.curve .ctl-reset { visibility: hidden; }
.curve.modified .ctl-reset { visibility: visible; }

.curve-box {
  position: relative;
  height: 132px;
  min-height: 132px;
  background-color: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: crosshair;
}

.curve-hist,
.curve-grid,
.curve-diag,
.curve-line,
.curve-dots {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
}

/* The histogram of the loaded layer: a curve without one is guesswork. */
.curve-bar {
  position: absolute;
  bottom: 0;
  background-color: var(--bg-raised-hi);
}

.curve-gridline {
  position: absolute;
  background-color: var(--border);
}

.curve-gridline.h { left: 0; right: 0; height: 1px; }
.curve-gridline.v { top: 0; bottom: 0; width: 1px; }

/* The identity, dotted, so "no change" reads as a shape rather than nothing. */
.curve-diagdot {
  position: absolute;
  width: 2px;
  height: 2px;
  margin-left: -1px;
  background-color: var(--border-strong);
}

.curve-seg {
  position: absolute;
  width: 3px;
  height: 3px;
  margin-left: -1px;
  border-radius: 2px;
  background-color: var(--text-dim);
}

.curve.modified .curve-seg { background-color: var(--accent-on-dark-text); }

.curve-dot {
  position: absolute;
  width: 9px;
  height: 9px;
  margin-left: -5px;
  margin-top: -5px;
  border-radius: var(--radius-sm);
  background-color: var(--bg-sunken);
  border: 1px solid var(--text);
  cursor: move;
}

.curve-dot:hover {
  background-color: var(--accent);
  border-color: var(--accent);
}

/* --------------------------------------------------------- presets */

.preset-bar {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background-color: var(--bg-raised);
  padding: 11px;
  display: flex;
  flex-direction: column;
}

.bar-label {
  display: flex;
  flex-direction: row;
  align-items: center;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
}

/* A real element: the accent tick a ::before would otherwise have drawn. */
.bar-tick {
  width: 2px;
  height: 9px;
  min-width: 2px;
  flex-grow: 0;
  flex-shrink: 0;
  margin-right: 8px;
  background-color: var(--accent);
}

.preset-row { margin-bottom: 5px; }

.preset-list {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
}

.preset-list > * {
  margin-right: 4px;
  margin-bottom: 4px;
}

.preset-chip {
  min-height: 22px;
  padding: 0 9px;
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: var(--font-ui);
  white-space: nowrap;
}

.preset-chip:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.preset-chip.active {
  background-color: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
  font-weight: 600;
}

.preset-chip.user { border-style: dashed; }

/* ---------------------------------------------------------- notice */

/*
 * Never a filled area, whatever it is reporting. Flat red belongs to the
 * accent alone; a message is a rule plus a tint plus text, so the two reds are
 * told apart by form rather than by hue at 10px.
 */
.notice {
  display: none;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  line-height: 1.6;
  border: 1px solid var(--border);
  border-left-width: 2px;
  border-left-color: var(--border-strong);
  background-color: var(--bg-raised);
  color: var(--text-dim);
  -webkit-user-select: text;
  user-select: text;
}

.notice.show { display: block; }

.notice.error {
  border-color: var(--danger);
  border-left-color: var(--danger);
  background-color: var(--accent-soft);
  color: var(--text);
}

.notice.warn {
  border-left-color: var(--warn);
  color: var(--text);
}

#app.theatre .rule,
#app.theatre .status,

#app.theatre .zoombar {
  flex-grow: 0;
  flex-shrink: 0;
  margin-top: 10px;

}

    let gx = dx0 * cos + dy * sin;
    let gy = -dx0 * sin + dy * cos;
    let p = y * w * 4;
    for (let x = 0; x < w; x++, p += 4, gx += cos, gy -= sin) {
      if (data[p + 3] < 8) continue;
      let col = ((gx - gminX) * invCell) | 0;
      let row = ((gy - gminY) * invCell) | 0;
      if (col < 0) col = 0;
      else if (col >= cols) col = cols - 1;
      if (row < 0) row = 0;
      else if (row >= rows) row = rows - 1;
      const ci = row * cols + col;

      const r = data[p];
      const g = data[p + 1];
      const b = data[p + 2];
      const dr = r - meanR[ci];
      const dg = g - meanG[ci];
      const db = b - meanB[ci];
      const wgt = Math.exp(-(dr * dr + dg * dg + db * db) / sigma2);

      lumW[ci] += lumaFn(r, g, b) * wgt;
      const q = ci * 3;
      rgbW[q] += r * wgt;
      rgbW[q + 1] += g * wgt;
      rgbW[q + 2] += b * wgt;
      wSum[ci] += wgt;
    }
  }

  const s = Math.max(0, Math.min(1, strength));
  for (let i = 0; i < n; i++) {
    const c = cells.count[i];
    if (!c || wSum[i] < 1e-6) continue;
    // Blend towards the refined mean, expressed back in "sum over count" form
    // so the rest of the pipeline keeps working unchanged.
    const k = c / wSum[i];
    cells.lum[i] = cells.lum[i] * (1 - s) + lumW[i] * k * s;
    for (let ch = 0; ch < 3; ch++) {
      cells.rgb[i * 3 + ch] = cells.rgb[i * 3 + ch] * (1 - s) + rgbW[i * 3 + ch] * k * s;
    }
  }
  return cells;
}

/**
 * @typedef {object} RasterParams
 * @property {number} radius        percent of the cell half size, 0..200
 * @property {string} shape
 * @property {number} gradeBias     -1..1
 * @property {number} radiusCurve   0..1
 * @property {boolean} invert
 * @property {Float32Array} toneLUT
 * @property {number[][]} palette   already spread + colour adjusted
 * @property {number[]} background  rgb
 * @property {object} colorAdjust   {hue, saturation, brightness}
 */

/**
 * Turn cell data into pixels.
 *
 * @param {CellData} cells
 * @param {RasterParams} p
 * @param {number} width
 * @param {number} height
 * @param {Uint8ClampedArray} [out] reused RGBA buffer
 * @param {{rowStart?: number, rowEnd?: number, skipBackground?: boolean}} [chunk]
 * @returns {Uint8ClampedArray}
 */
function rasterize(cells, p, width, height, out, chunk = {}) {
  const grid = cells.grid;
  const buf = out || new Uint8ClampedArray(width * height * 4);

  if (!chunk.skipBackground) fillBackground(buf, p.background);

  const shape = getShape(p.shape);
  const maxRadius = (grid.cell * 0.5 * p.radius) / 100;
  const gain = (grid.cell * (p.dotGain || 0)) / 100;
  const labPal = paletteToLab(p.palette);
  const centre = [0, 0];
  const adj = p.colorAdjust || {};
  const adjOut = [0, 0, 0];
  const jit = p.jitter && !jitterIsIdentity(p.jitter) ? p.jitter : null;
  const jOut = [0, 0, 1, 0];
  const fm = p.screenType === "fm" ? p.fmThreshold : null;
  const cellColor = p.cellColor || null;

  // A viewport lets the caller rasterise a window of a much larger virtual
  // render - which is what zooming is. The grid is built for the full virtual
  // size and the window is subtracted here, so a dot lands in exactly the same
  // place whether you are looking at the whole image or at one corner of it at
  // 1:1. Cells outside the window are skipped entirely, so a zoomed preview
  // costs what the window costs rather than what the document costs.
  const viewX = p.viewX || 0;
  const viewY = p.viewY || 0;
  const cull = (grid.cell * Math.max(1, p.radius / 100)) + 2;

  const rowStart = chunk.rowStart || 0;
  const rowEnd = chunk.rowEnd === undefined ? grid.rows : Math.min(grid.rows, chunk.rowEnd);

  for (let row = rowStart; row < rowEnd; row++) {
    for (let col = 0; col < grid.cols; col++) {
      const ci = row * grid.cols + col;
      const cnt = cells.count[ci];
      if (cnt === 0) continue;

      // --- geometry: luminance -> grade -> ink -> radius --------------
      const L = cells.lum[ci] / cnt;
      const graded = sampleLUT(p.toneLUT, L);
      let ink = p.invert ? graded : 1 - graded;
      ink = biasCurve(ink, p.gradeBias);
      let r;
      if (fm) {
        // Frequency modulation: every dot is the same size and the *number* of
        // them carries the tone. Comparing the ink against a blue-noise
        // threshold is what places them - blue noise because it has no
        // low-frequency energy, so the result reads as an even grain rather
        // than as a pattern.
        if (ink <= fm(col, row)) continue;
        r = maxRadius;
      } else {
        r = inkToRadius(ink, maxRadius, p.radiusCurve);
        if (r <= 0.008) continue;
      }
      // Dot gain models a press spreading ink by a fixed width around every
      // edge, which is a radius offset - not a tonal curve like Grade Bias.
      r += gain;

      // --- colour: cell mean -> hue/sat/bright -> nearest palette -----
      // The pipeline caches this per cell, because it depends on none of the
      // geometry controls; computing it here is the fallback for callers that
      // do not (the SVG exporter, and any direct use of the rasteriser).
      let pi;
      if (cellColor) {
        pi = cellColor[ci];
      } else {
        const q = ci * 3;
        adjustColor(cells.rgb[q] / cnt, cells.rgb[q + 1] / cnt, cells.rgb[q + 2] / cnt, adj, adjOut);
        pi = nearestIndex(labPal, adjOut[0], adjOut[1], adjOut[2]);
      }
      const col3 = p.palette[pi];

      cellCentre(grid, col, row, centre);
      const px = centre[0] - viewX;
      const py = centre[1] - viewY;
      if (px < -cull || py < -cull || px > width + cull || py > height + cull) continue;

      let rot = 0;
      let dx = px;
      let dy = py;
      if (jit) {
        dotJitter(col, row, jit, grid.cell, jOut);
        dx += jOut[0];
        dy += jOut[1];
        r *= jOut[2];
        rot = jOut[3];
        if (r <= 0.008) continue;
      }
      drawDot(buf, width, height, dx, dy, r, grid.cell, shape, col3, rot);
    }
  }

  return buf;
}

/**
 * @typedef {object} Screen
 * @property {Grid} grid
 * @property {Float32Array} cov    ink coverage per cell, 0..1
 * @property {Uint32Array} count   opaque pixel count per cell
 * @property {number[]} color      ink colour, rgb
 * @property {number} paletteIndex index into the full palette
 */

/**
 * Rasterise a set of independently angled ink screens, overprinting them.
 *
 * This is the difference between a poster and a print. Each ink gets its own
 * grid at its own angle and the inks composite by *multiply*, because real ink
 * is transparent: cyan over magenta gives blue, and the offset screens interlock
 * into a rosette instead of beating into a moiré.
 *
 * @param {Screen[]} screens
 * @param {object} p {radius, shape, radiusCurve, dotGain, background}
 * @param {number} width
 * @param {number} height
 * @param {Uint8ClampedArray} [out]
 * @param {{screenStart?: number, screenEnd?: number, skipBackground?: boolean}} [chunk]
 */
function rasterizeScreens(screens, p, width, height, out, chunk = {}) {
  const buf = out || new Uint8ClampedArray(width * height * 4);
  if (!chunk.skipBackground) fillBackground(buf, p.background);

  const shape = getShape(p.shape);
  const centre = [0, 0];
  const first = chunk.screenStart || 0;
  const last = chunk.screenEnd === undefined ? screens.length : Math.min(screens.length, chunk.screenEnd);

  const jit = p.jitter && !jitterIsIdentity(p.jitter) ? p.jitter : null;
  const jOut = [0, 0, 1, 0];
  const fm = p.screenType === "fm" ? p.fmThreshold : null;
  // See rasterize(): the window of a larger virtual render, so zooming shows
  // the same dots in the same places rather than a re-derived pattern.
  const viewX = p.viewX || 0;
  const viewY = p.viewY || 0;

  for (let s = first; s < last; s++) {
    const screen = screens[s];
    const grid = screen.grid;
    const maxRadius = (grid.cell * 0.5 * p.radius) / 100;
    const gain = (grid.cell * (p.dotGain || 0)) / 100;
    const colour = screen.color;
    // Misregistration: the whole plate lands a hair off, so it is a constant
    // offset for the screen rather than per-dot noise.
    const cull = grid.cell * Math.max(1, p.radius / 100) + 2;
    const mx = screen.offsetX || 0;
    const my = screen.offsetY || 0;

    for (let row = 0; row < grid.rows; row++) {
      for (let col = 0; col < grid.cols; col++) {
        const ci = row * grid.cols + col;
        if (screen.count[ci] === 0) continue;
        let r;
        if (fm) {
          if (screen.cov[ci] <= fm(col, row + s * 97)) continue;
          r = maxRadius;
        } else {
          r = inkToRadius(screen.cov[ci], maxRadius, p.radiusCurve);
          if (r <= 0.008) continue;
        }
        r += gain;
        cellCentre(grid, col, row, centre);
        let px = centre[0] + mx - viewX;
        let py = centre[1] + my - viewY;
        if (px < -cull || py < -cull || px > width + cull || py > height + cull) continue;
        let rot = 0;
        if (jit) {
          dotJitter(col, row + s * 31, jit, grid.cell, jOut);
          px += jOut[0];
          py += jOut[1];
          r *= jOut[2];
          rot = jOut[3];
          if (r <= 0.008) continue;
        }
        drawDotMultiply(buf, width, height, px, py, r, grid.cell, shape, colour, rot);
      }
    }
  }
  return buf;
}

/**
 * Draw one transparent-ink dot: `out = out · (1 − a + a·ink)`.
 *
 * The lerp is between "leave the pixel alone" and "multiply it by the ink", so
 * partial coverage from the antialiasing band behaves exactly like partial ink
 * area, which is what keeps overprints clean at the dot edges.
 */
function drawDotMultiply(buf, w, h, cx, cy, r, cell, shape, colour, rot) {
  const rc = rot ? Math.cos(-rot) : 1;
  const rs = rot ? Math.sin(-rot) : 0;
  const ir = colour[0] / 255;
  const ig = colour[1] / 255;
  const ib = colour[2] / 255;

  const apply = (x, y, a) => {
    if (x < 0 || y < 0 || x >= w || y >= h || a <= 0) return;
    const i = (y * w + x) * 4;
    buf[i] = buf[i] * (1 - a + a * ir);
    buf[i + 1] = buf[i + 1] * (1 - a + a * ig);
    buf[i + 2] = buf[i + 2] * (1 - a + a * ib);
    buf[i + 3] = 255;
  };

  if (r < 0.5) {
    const area = Math.min(1, shape.area(r, cell));
    if (area <= 0.0005) return;
    const fx = cx - 0.5;
    const fy = cy - 0.5;
    const x0 = Math.floor(fx);
    const y0 = Math.floor(fy);
    const tx = fx - x0;
    const ty = fy - y0;
    apply(x0, y0, area * (1 - tx) * (1 - ty));
    apply(x0 + 1, y0, area * tx * (1 - ty));
    apply(x0, y0 + 1, area * (1 - tx) * ty);
    apply(x0 + 1, y0 + 1, area * tx * ty);
    return;
  }

  const ext = shape.extent(r, cell) + 1;
  const x0 = Math.max(0, Math.floor(cx - ext));
  const x1 = Math.min(w, Math.ceil(cx + ext));
  const y0 = Math.max(0, Math.floor(cy - ext));
  const y1 = Math.min(h, Math.ceil(cy + ext));
  const sdf = shape.sdf;
  for (let y = y0; y < y1; y++) {
    const dy0 = y + 0.5 - cy;
    for (let x = x0; x < x1; x++) {
      const dx0 = x + 0.5 - cx;
      const dx = rot ? dx0 * rc - dy0 * rs : dx0;
      const dy = rot ? dx0 * rs + dy0 * rc : dy0;
      const d = sdf(dx, dy, r, cell);
      if (d >= 0.5) continue;
      apply(x, y, d <= -0.5 ? 1 : 0.5 - d);
    }
  }
}

/**
 * One coverage mask per ink screen, for the separated output.
 *
 * Unlike the opaque model these masks are NOT mutually exclusive - overlapping
 * is the whole point of a rosette - so the fill layers they feed must be set to
 * Multiply, and the paper layer stays fully opaque underneath.
 *
 * @returns {Uint8ClampedArray[]} one mask per screen, in screen order
 */
function rasterizeScreensSeparated(screens, p, width, height) {
  const shape = getShape(p.shape);
  const centre = [0, 0];
  const masks = [];

  for (const screen of screens) {
    const mask = new Uint8ClampedArray(width * height);
    const grid = screen.grid;
    const maxRadius = (grid.cell * 0.5 * p.radius) / 100;
    const gain = (grid.cell * (p.dotGain || 0)) / 100;

    const paint = (x, y, a) => {
      if (x < 0 || y < 0 || x >= w0 || y >= h0 || a <= 0) return;
      const i = y * w0 + x;
      // Coverage accumulates, it does not replace: two dots of the same ink
      // overlapping are still that ink.
      const v = mask[i] / 255;
      mask[i] = (v + a * (1 - v)) * 255;
    };
    const w0 = width;
    const h0 = height;

    for (let row = 0; row < grid.rows; row++) {
      for (let col = 0; col < grid.cols; col++) {
        const ci = row * grid.cols + col;
        if (screen.count[ci] === 0) continue;
        let r = inkToRadius(screen.cov[ci], maxRadius, p.radiusCurve);
        if (r <= 0.008) continue;
        r += gain;
        cellCentre(grid, col, row, centre);
        stampCoverage(paint, centre[0], centre[1], r, grid.cell, shape);
      }
    }
    masks.push(mask);
  }
  return masks;
}

/** Shared traversal for coverage stamping, used by the separated screens path. */
function stampCoverage(paint, cx, cy, r, cell, shape) {
  if (r < 0.5) {
    const area = Math.min(1, shape.area(r, cell));
    if (area <= 0.0005) return;
    const fx = cx - 0.5;
    const fy = cy - 0.5;
    const x0 = Math.floor(fx);
    const y0 = Math.floor(fy);
    const tx = fx - x0;
    const ty = fy - y0;
    paint(x0, y0, area * (1 - tx) * (1 - ty));
    paint(x0 + 1, y0, area * tx * (1 - ty));
    paint(x0, y0 + 1, area * (1 - tx) * ty);
    paint(x0 + 1, y0 + 1, area * tx * ty);
    return;
  }
  const ext = shape.extent(r, cell) + 1;
  const sdf = shape.sdf;
  for (let y = Math.floor(cy - ext); y <= Math.ceil(cy + ext); y++) {
    const dy = y + 0.5 - cy;
    for (let x = Math.floor(cx - ext); x <= Math.ceil(cx + ext); x++) {
      const d = sdf(x + 0.5 - cx, dy, r, cell);
      if (d >= 0.5) continue;
      paint(x, y, d <= -0.5 ? 1 : 0.5 - d);
    }
  }
}

/**
 * Rasterise into one 8-bit coverage mask per palette entry instead of a
 * composite, for the colour-separated output.
 *
 * The masks are mutually exclusive and sum to 255 everywhere: painting colour i
 * with coverage a does `mask_i = mask_i(1-a) + 255a` and `mask_j *= (1-a)` for
 * every other j. That is ordinary alpha compositing performed per channel, so
 * the separation reproduces the flat render exactly *and* is independent of the
 * order the fill layers end up stacked in - which matters, because dots of
 * different colours overlap and layer order would otherwise decide the result.
 *
 * @param {CellData} cells
 * @param {RasterParams} p    p.palette is the full palette; p.paperIndex is the
 *                            entry the paper uses
 * @param {number} width
 * @param {number} height
 * @returns {Uint8ClampedArray[]} one mask per palette entry
 */
function rasterizeSeparated(cells, p, width, height) {
  const grid = cells.grid;
  // One mask per FULL palette entry (p.palette holds only the inks).
  const n = p.fullPalette.length;
  const masks = [];
  for (let i = 0; i < n; i++) masks.push(new Uint8ClampedArray(width * height));
  // The paper starts covering everything; ink eats into it.
  const paper = masks[p.paperIndex];
  paper.fill(255);

  const shape = getShape(p.shape);
  const maxRadius = (grid.cell * 0.5 * p.radius) / 100;
  const gain = (grid.cell * (p.dotGain || 0)) / 100;
  const labPal = paletteToLab(p.inkPalette);
  const centre = [0, 0];
  const adj = p.colorAdjust || {};
  const adjOut = [0, 0, 0];

  for (let row = 0; row < grid.rows; row++) {
    for (let col = 0; col < grid.cols; col++) {
      const ci = row * grid.cols + col;
      const cnt = cells.count[ci];
      if (cnt === 0) continue;

      const L = cells.lum[ci] / cnt;
      const graded = sampleLUT(p.toneLUT, L);
      let ink = p.invert ? graded : 1 - graded;
      ink = biasCurve(ink, p.gradeBias);
      let r = inkToRadius(ink, maxRadius, p.radiusCurve);
      if (r <= 0.008) continue;
      r += gain;

      const q = ci * 3;
      adjustColor(cells.rgb[q] / cnt, cells.rgb[q + 1] / cnt, cells.rgb[q + 2] / cnt, adj, adjOut);
      const inkIdx = nearestIndex(labPal, adjOut[0], adjOut[1], adjOut[2]);
      const target = p.inkToPaletteIndex[inkIdx];

      cellCentre(grid, col, row, centre);
      drawDotMasks(masks, width, height, centre[0], centre[1], r, grid.cell, shape, target);
    }
  }
  return masks;
}

/**
 * Mask-writing twin of drawDot. The traversal is duplicated rather than shared
 * behind a callback because a per-pixel indirect call costs more than the whole
 * coverage computation.
 */
function drawDotMasks(masks, w, h, cx, cy, r, cell, shape, target) {
  const n = masks.length;

  const paint = (x, y, a) => {
    if (x < 0 || y < 0 || x >= w || y >= h || a <= 0) return;
    const i = y * w + x;
    const ia = 1 - a;
    for (let m = 0; m < n; m++) {
      masks[m][i] = m === target ? masks[m][i] * ia + 255 * a : masks[m][i] * ia;
    }
  };

  if (r < 0.5) {
    const area = Math.min(1, shape.area(r, cell));
    if (area <= 0.0005) return;
    const fx = cx - 0.5;
    const fy = cy - 0.5;
    const x0 = Math.floor(fx);
    const y0 = Math.floor(fy);
    const tx = fx - x0;
    const ty = fy - y0;
    paint(x0, y0, area * (1 - tx) * (1 - ty));
    paint(x0 + 1, y0, area * tx * (1 - ty));
    paint(x0, y0 + 1, area * (1 - tx) * ty);
    paint(x0 + 1, y0 + 1, area * tx * ty);
    return;
  }

  const ext = shape.extent(r, cell) + 1;
  let x0 = Math.max(0, Math.floor(cx - ext));
  let x1 = Math.min(w, Math.ceil(cx + ext));
  let y0 = Math.max(0, Math.floor(cy - ext));
  let y1 = Math.min(h, Math.ceil(cy + ext));
  const sdf = shape.sdf;
  for (let y = y0; y < y1; y++) {
    const dy = y + 0.5 - cy;
    for (let x = x0; x < x1; x++) {
      const d = sdf(x + 0.5 - cx, dy, r, cell);
      if (d >= 0.5) continue;
      paint(x, y, d <= -0.5 ? 1 : 0.5 - d);
    }
  }
}

/**
 * Paint the paper colour across the whole frame.
 *
 * Written once as a short seed run and then doubled with `copyWithin`, which is
 * a memmove rather than a JS loop: each pass moves twice as many bytes as the
 * last, so the whole buffer is filled in log2(n) native block copies instead of
 * n/4 interpreted iterations.
 *
 * This is worth the trickery because it is not a marginal cost. On a 6000x4000
 * render the naive per-pixel loop was 95ms of a 223ms render - 43% of the total,
 * spent writing a colour that is about to be covered up. Measured on the same
 * 96MB buffer: naive 65ms, this 10ms.
 *
 * The doubling form is used rather than filling a Uint32Array view, which is
 * just as fast, because packing RGBA into one word assumes little-endian byte
 * order and this does not.
 */
function fillBackground(buf, bg) {
  const n = buf.length;
  if (n === 0) return;
  const r = bg[0], g = bg[1], b = bg[2];

  // Seed: one block of whole pixels, then double until the buffer is full.
  const seed = Math.min(n, 256);
  for (let i = 0; i < seed; i += 4) {
    buf[i] = r;
    buf[i + 1] = g;
    buf[i + 2] = b;
    buf[i + 3] = 255;
  }
  let filled = seed;
  while (filled < n) {
    const take = Math.min(filled, n - filled);
    buf.copyWithin(filled, 0, take);
    filled += take;
  }
}

/**
 * Draw a single antialiased dot.
 *
 * Two regimes:
 *  - r >= 0.5px : signed distance field coverage, 1px transition band.
 *  - r <  0.5px : the dot is smaller than a pixel, so its exact analytic area
 *    is splatted bilinearly onto the 4 neighbouring pixels. Without this the
 *    highlight end of a gradient would clamp to a fixed half-covered pixel and
 *    the ramp would visibly stop being smooth.
 */
function drawDot(buf, w, h, cx, cy, r, cell, shape, colour, rot) {
  const cr = colour[0], cg = colour[1], cb = colour[2];
  const rc = rot ? Math.cos(-rot) : 1;
  const rs = rot ? Math.sin(-rot) : 0;

  if (r < 0.5) {
    const area = Math.min(1, shape.area(r, cell));
    if (area <= 0.0005) return;
    const fx = cx - 0.5;
    const fy = cy - 0.5;
    const x0 = Math.floor(fx);
    const y0 = Math.floor(fy);
    const tx = fx - x0;
    const ty = fy - y0;
    blend(buf, w, h, x0, y0, area * (1 - tx) * (1 - ty), cr, cg, cb);
    blend(buf, w, h, x0 + 1, y0, area * tx * (1 - ty), cr, cg, cb);
    blend(buf, w, h, x0, y0 + 1, area * (1 - tx) * ty, cr, cg, cb);
    blend(buf, w, h, x0 + 1, y0 + 1, area * tx * ty, cr, cg, cb);
    return;
  }

  const ext = shape.extent(r, cell) + 1;
  let x0 = Math.floor(cx - ext);
  let x1 = Math.ceil(cx + ext);
  let y0 = Math.floor(cy - ext);
  let y1 = Math.ceil(cy + ext);
  if (x1 < 0 || y1 < 0 || x0 >= w || y0 >= h) return;
  if (x0 < 0) x0 = 0;
  if (y0 < 0) y0 = 0;
  if (x1 > w) x1 = w;
  if (y1 > h) y1 = h;

  const sdf = shape.sdf;
  // The interior fast path only applies to an unrotated dot: a span is a
  // horizontal run, and rotating the sampling frame is exactly what stops the
  // interior being horizontal.
  const span = rot ? null : shape.span;

  for (let y = y0; y < y1; y++) {
    const dy0 = y + 0.5 - cy;
    const rowBase = y * w * 4;

    // Split the row into [x0, inA) edge, [inA, inB) interior, [inB, x1) edge.
    // Everything in the interior is fully covered by definition of `span`, so
    // it is a straight store with no distance evaluation and no blend. On a
    // 13px dot that is roughly three quarters of its pixels.
    let inA = x1;
    let inB = x1;
    if (span) {
      const sp = span(dy0, r, cell);
      if (sp > 0) {
        const a = Math.ceil(cx - sp - 0.5);
        const b = Math.floor(cx + sp - 0.5) + 1;
        inA = a < x0 ? x0 : a > x1 ? x1 : a;
        inB = b < inA ? inA : b > x1 ? x1 : b;
      }
    }

  row.appendChild(reset);

  let current = value;
  let dragging = false;

  function paint() {
    const t = (current - def.min) / (def.max - def.min);
    const pct = clamp(t, 0, 1) * 100;
    fill.style.width = pct + "%";
    thumb.style.left = pct + "%";
    if (document.activeElement !== input) input.value = formatValue(def, current);
    const modified = Math.abs(current - def.def) > (def.step || 1) / 1000;
    row.className = "ctl" + (modified ? " modified" : "");
    label.className = "ctl-label" + (modified ? " modified" : "");
  }

  function set(v, committed, silent) {
    const stepped = def.step ? Math.round(v / def.step) * def.step : v;
    const next = clamp(roundFloat(stepped), def.min, def.max);
    const changed = next !== current;
    current = next;
    paint();
    if (!silent && (changed || committed)) onChange(current, !!committed);
  }

  function valueFromEvent(e) {
    const rect = track.getBoundingClientRect();
    if (!rect.width) return current;
    const t = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return def.min + t * (def.max - def.min);
  }

  let fineAnchor = null;
  slider.addEventListener("pointerdown", (e) => {
    dragging = true;
    slider.className = "slider dragging";
    try {
      slider.setPointerCapture(e.pointerId);
    } catch (err) {
      /* capture is an optimisation, not a requirement */
    }
    fineAnchor = e.shiftKey ? { x: e.clientX, v: current } : null;
    if (!fineAnchor) set(valueFromEvent(e), false);
    e.preventDefault();
  });

  slider.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    if (e.shiftKey) {
      // Shift engages fine scrubbing relative to where Shift was pressed.
      if (!fineAnchor) fineAnchor = { x: e.clientX, v: current };
      const rect = track.getBoundingClientRect();
      const perPx = rect.width ? (def.max - def.min) / rect.width : 0;
      set(fineAnchor.v + (e.clientX - fineAnchor.x) * perPx * 0.2, false);
    } else {
      fineAnchor = null;
      set(valueFromEvent(e), false);
    }
  });

  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    fineAnchor = null;
    slider.className = "slider";
    try {
      slider.releasePointerCapture(e.pointerId);
    } catch (err) {
      /* ignore */
    }
    onChange(current, true);
  };
  slider.addEventListener("pointerup", endDrag);
  slider.addEventListener("pointercancel", endDrag);

  slider.addEventListener("dblclick", () => set(def.def, true));
  reset.addEventListener("click", () => set(def.def, true));

  input.addEventListener("change", () => {
    const v = parseValue(def, input.value);
    if (v === null) paint();
    else set(v, true);
  });
  input.addEventListener("blur", () => paint());
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const v = parseValue(def, input.value);
      if (v !== null) set(v, true);
      input.blur();
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const dir = e.key === "ArrowUp" ? 1 : -1;
      const mult = e.shiftKey ? 10 : 1;
      set(current + dir * (def.step || 1) * mult, true);
      e.preventDefault();
    }
  });

  paint();
  return { el: row, set: (v) => set(v, false, true) };
}

function roundFloat(v) {
  return Math.round(v * 1e6) / 1e6;
}

/**
 * A segmented button group. Used instead of <select>, which UXP renders
 * inconsistently.
 */
function createChoice(def, value, onChange, labels) {
  const row = el("div", "ctl");
  const label = el("div", "ctl-label", def.label);
  if (def.hint) label.title = def.hint;
  const seg = el("div", "seg");
  const buttons = {};
  const nameOf = (opt) => optionLabel(def, opt, labels);

  for (const opt of def.options) {
    const b = el("button", "seg-item", nameOf(opt));
    b.title = nameOf(opt);
    b.addEventListener("click", () => {
      set(opt);
      onChange(opt, true);
    });
    buttons[opt] = b;
    seg.appendChild(b);
  }

  function set(v) {
    for (const opt of def.options) {
      buttons[opt].className = "seg-item" + (opt === v ? " active" : "");
    }
  }

  row.appendChild(label);
  row.appendChild(seg);
  set(value);
  return { el: row, set };
}

function titleCase(s) {
  return String(s)
    .replace(/([a-z])([A-Z])/g, "$1 $2")
    .replace(/^./, (c) => c.toUpperCase());
}

/**
 * The display name for one option of a choice.
 *
 * Title-casing the id is right for `circle` and `perInk`, and wrong for every
 * acronym and compound we have: it produces "Dpi", "Am", "Kmeans", "Luma709".
 * A def may therefore carry an `optionLabels` map, which wins.
 */
function optionLabel(def, opt, labels) {
  if (labels && labels[opt]) return labels[opt];
  if (def && def.optionLabels && def.optionLabels[opt]) return def.optionLabels[opt];
  return titleCase(opt);
}

/**
 * A wrapping list of chips, for choices with too many options to fit a
 * segmented bar (the dither algorithm list has two dozen).
 *
 * @param {object} def
 * @param {string} value
 * @param {(v:string, committed:boolean)=>void} onChange
 * @param {{labels?: object, groups?: {id:string,label:string}[],
 *          groupOf?: (id:string)=>string}} [meta]
 */
function createChipChoice(def, value, onChange, meta = {}) {
  const wrap = el("div");
  const label = el("div", "ctl-label", def.label);
  label.style.marginBottom = "3px";
  if (def.hint) label.title = def.hint;
  wrap.appendChild(label);

  const buttons = {};
  const groups = meta.groups && meta.groupOf ? meta.groups : null;

  const addChip = (opt, host) => {
    const text = optionLabel(def, opt, meta.labels);
    const b = el("button", "algo-chip", text);
    b.title = text;
    b.addEventListener("click", () => {
      set(opt);
      onChange(opt, true);
    });
    buttons[opt] = b;
    host.appendChild(b);
  };

  let grouped = 0;
  if (groups) {
    for (const g of groups) {
      const members = def.options.filter((o) => meta.groupOf(o) === g.id);
      if (!members.length) continue;
      wrap.appendChild(el("div", "chip-group-label", g.label));
      const row = el("div", "chip-row");
      for (const opt of members) addChip(opt, row);
      wrap.appendChild(row);
      grouped += members.length;
    }
  }
  // Ungrouped, or grouping that claimed nothing: a control that renders no
  // options at all is never the right answer, so fall back to a flat row.
  if (!groups || grouped < def.options.length) {
    const claimed = Object.keys(buttons);
    const rest = def.options.filter((o) => claimed.indexOf(o) < 0);
    if (rest.length) {
      const row = el("div", "chip-row");
      for (const opt of rest) addChip(opt, row);
      wrap.appendChild(row);
    }
  }

  function set(v) {
    for (const opt of def.options) {
      if (buttons[opt]) buttons[opt].className = "algo-chip" + (opt === v ? " active" : "");
    }
  }

  set(value);
  return { el: wrap, set };
}

/** An on/off switch. */
function createToggle(def, value, onChange) {
  const row = el("div", "ctl");
  const label = el("div", "ctl-label", def.label);
  if (def.hint) label.title = def.hint;
  const toggle = el("button", "toggle");
  toggle.appendChild(el("div", "toggle-knob"));

  function set(v) {
    toggle.className = "toggle" + (v ? " on" : "");
    toggle.dataset.value = v ? "1" : "0";
  }

  toggle.addEventListener("click", () => {
    const next = toggle.dataset.value !== "1";
    set(next);
    onChange(next, true);
  });

  row.appendChild(label);
  row.appendChild(toggle);
  const spacer = el("div");
  spacer.style.flexGrow = "1";
  spacer.style.flexShrink = "1";
  row.appendChild(spacer);
  set(value);
  return { el: row, set };
}

/**
 * Palette editor: click a swatch to type a hex value, alt/right click to pull
 * Photoshop's current foreground colour.
 *
 * @param {object} opts
 * @param {string[]} opts.value
 * @param {(hexes: string[]) => void} opts.onChange
 * @param {() => void} opts.onExtract
 * @param {() => (number[]|null)} opts.getForeground
 */
function createPalette(opts) {
  const wrap = el("div");
  const strip = el("div", "palette");
  const actions = el("div", "palette-actions");

  const mkBtn = (label, title, fn) => {
    const b = el("button", "btn btn-small", label);
    b.title = title;
    b.addEventListener("click", fn);
    return b;
  };

  actions.appendChild(mkBtn("Extract", "Re-read the palette from the layer", () => opts.onExtract()));
  actions.appendChild(
    mkBtn("＋FG", "Append Photoshop's foreground colour", () => {
      const rgb = opts.getForeground();
      if (!rgb) return;
      set(current.concat([toHex(rgb)]), locked);
      opts.onChange(current.slice(), locked.slice());
    })
  );
  actions.appendChild(mkBtn("Import", "Load an .ase or .act swatch file", () => opts.onImport && opts.onImport()));
  actions.appendChild(mkBtn("Export", "Save the palette as .ase", () => opts.onExport && opts.onExport()));

  let current = (opts.value || []).slice();
  let locked = (opts.locked || []).slice();

  function toHex(rgb) {
    return (
      "#" + ((rgb[0] << 16) | (rgb[1] << 8) | rgb[2]).toString(16).padStart(6, "0").toUpperCase()
    );
  }

  function beginEdit(index, swatchWrap, swatch) {
    const input = el("input", "swatch-input");
    input.type = "text";
    input.value = current[index];
    swatch.style.display = "none";
    swatchWrap.appendChild(input);
    input.focus();
    if (input.select) input.select();

    const finish = (commit) => {
      if (!input.parentNode) return;
      const raw = input.value;
      swatchWrap.removeChild(input);
      swatch.style.display = "";
      if (commit) {
        const norm = normalizeHex(raw);
        if (norm) {
          current[index] = norm;
          set(current, locked);
          opts.onChange(current.slice(), locked.slice());
          return;
        }
      }
      set(current, locked);
    };
    input.addEventListener("blur", () => finish(true));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      else if (e.key === "Escape") finish(false);
    });
  }

  function toggleLock(i) {
    const at = locked.indexOf(i);
    if (at >= 0) locked.splice(at, 1);
    else locked.push(i);
    set(current, locked);
    opts.onChange(current.slice(), locked.slice());
  }

  function set(hexes, lockedIdx) {
    current = (hexes || []).slice();
    if (lockedIdx) locked = lockedIdx.slice();
    locked = locked.filter((i) => i < current.length);
    strip.textContent = "";
    current.forEach((hex, i) => {
      const swatchWrap = el("div", "swatch-wrap");
      const swatch = el("div", "swatch");
      swatch.style.background = hex;
      swatch.title =
        `${hex} — click to edit, alt-click for the foreground colour, ` +
        `shift-click to ${locked.indexOf(i) >= 0 ? "unlock" : "lock"} against re-extraction`;
      swatch.addEventListener("click", (e) => {
        if (e.shiftKey) {
          toggleLock(i);
          return;
        }
        if (e.altKey) {
          const rgb = opts.getForeground();
          if (rgb) {
            current[i] = toHex(rgb);
            set(current, locked);
            opts.onChange(current.slice(), locked.slice());
          }
          return;
        }
        beginEdit(i, swatchWrap, swatch);
      });
      swatchWrap.appendChild(swatch);
      if (locked.indexOf(i) >= 0) {
        const badge = el("div", "swatch-lock");
        badge.title = "Locked: survives re-extraction";
        swatchWrap.appendChild(badge);
      }
      strip.appendChild(swatchWrap);
    });
  }

  wrap.appendChild(strip);
  wrap.appendChild(actions);
  set(current, locked);
  return { el: wrap, set, setLocked: (l) => set(current, l) };
}

function normalizeHex(c) {
  let h = String(c).trim().replace(/^#/, "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return "#" + h.toUpperCase();
}

/** A hex field that also accepts the literal "auto". */
function createColorField(def, value, onChange, getForeground) {
  const row = el("div", "ctl");
  const label = el("div", "ctl-label", def.label);
  if (def.hint) label.title = def.hint;

  const swatch = el("div", "swatch");
  const input = el("input", "ctl-value");
  input.type = "text";
  input.style.textAlign = "left";
  input.style.width = "70px";
  input.style.minWidth = "70px";

  const autoBtn = el("button", "seg-item", "Auto");
  autoBtn.style.width = "38px";
  autoBtn.style.minWidth = "38px";
  autoBtn.style.flexGrow = "0";
  autoBtn.style.flexShrink = "0";
  autoBtn.style.border = "1px solid var(--border-strong)";
  autoBtn.style.borderRadius = "2px";
  autoBtn.addEventListener("click", () => {
    set("auto");
    onChange("auto", true);
  });

  swatch.addEventListener("click", () => {
    const rgb = getForeground && getForeground();
    if (!rgb) return;
    const hex =
      "#" + ((rgb[0] << 16) | (rgb[1] << 8) | rgb[2]).toString(16).padStart(6, "0").toUpperCase();
    set(hex);
    onChange(hex, true);
  });
  swatch.title = "Use Photoshop's foreground colour";

  function set(v) {
    input.value = v;
    swatch.style.background = v === "auto" ? "transparent" : v;
    autoBtn.className = "seg-item" + (v === "auto" ? " active" : "");
  }

  input.addEventListener("change", () => {
    const raw = input.value.trim();
    if (raw.toLowerCase() === "auto") {
      set("auto");
      onChange("auto", true);
      return;
    }
    const norm = normalizeHex(raw);
    if (norm) {
      set(norm);
      onChange(norm, true);
    } else {
      set(value);
    }
  });

  row.appendChild(label);
  row.appendChild(swatch);
  row.appendChild(input);
  row.appendChild(autoBtn);
  set(value);
  return { el: row, set };
}

/* ------------------------------------------------------------------ *
 * Tone curve
 * ------------------------------------------------------------------ */

/**
 * The editor's height in pixels.
 *
 * Stated here and in the stylesheet, because the curve is drawn by positioning
 * elements and that needs a number, while the box needs a height before any of
 * them exist to measure. The two must agree; the layout test would catch them
 * drifting, since the curve would leave its box.
 */
const CURVE_H = 132;
/** How many segments the curve is drawn with. Enough to read as a line. */
const CURVE_SAMPLES = 64;
/** How close a click has to be, in fractions of the box, to grab a point. */
const CURVE_GRAB = 0.055;

/**
 * A tone curve editor.
 *
 * Built from positioned divs rather than a canvas: UXP's canvas support varies
 * by host version, and this needs to work everywhere the rest of the panel does.
 * The curve is drawn as a run of short segments and the control points are real
 * elements, which also means they can carry their own pointer handlers instead
 * of the editor doing hit-testing on every move.
 *
 * A histogram of the loaded layer sits behind it, because a curve without one is
 * guesswork - you cannot place a point on the shadows if you cannot see where
 * the shadows are.
 *
 * @param {object} def ParamDef
 * @param {number[][]} value control points
 * @param {(v:number[][], committed:boolean)=>void} onChange
 * @param {{getHistogram?: () => number[]|null}} [opts]
 */
function createCurve(def, value, onChange, opts = {}) {
  const wrap = el("div", "curve");

  const head = el("div", "curve-head");
  const label = el("div", "ctl-label", def.label);
  if (def.hint) label.title = def.hint;
  const readout = el("div", "curve-readout", "");
  const reset = el("button", "ctl-reset", "↺");
  reset.title = "Straighten the curve";
  head.appendChild(label);
  head.appendChild(readout);
  head.appendChild(reset);
  wrap.appendChild(head);

  const box = el("div", "curve-box");
  const hist = el("div", "curve-hist");
  const grid = el("div", "curve-grid");
  const diag = el("div", "curve-diag");
  const line = el("div", "curve-line");
  const dots = el("div", "curve-dots");
  box.appendChild(hist);
  box.appendChild(grid);
  box.appendChild(diag);
  box.appendChild(line);
  box.appendChild(dots);
  wrap.appendChild(box);
  wrap.appendChild(el("div", "hint", "Click to add a point · drag to shape · alt-click a point to remove"));

  // Quarter grid, and a dotted diagonal so "no change" is visible as a shape.
  for (let i = 1; i < 4; i++) {
    const h = el("div", "curve-gridline h");
    h.style.top = pct(i / 4);
    grid.appendChild(h);
    const v = el("div", "curve-gridline v");
    v.style.left = pct(i / 4);
    grid.appendChild(v);
  }
  for (let i = 0; i < 22; i++) {
    const d = el("div", "curve-diagdot");
    const t = i / 21;
    d.style.left = pct(t);
    d.style.top = yPx(t);
    diag.appendChild(d);
  }

  let points = normaliseCurve(value);

  function pct(t) {
    return (t * 100).toFixed(3) + "%";
  }

  /** Curve value -> pixel offset from the top of the box. */
  function yPx(v) {
    return Math.round((1 - v) * (CURVE_H - 3)) + "px";
  }

  /*
   * Repaint by moving what already exists.
   *
   * This used to rebuild every segment and every control point on each
   * pointermove - seventy-odd elements per frame, including the very dot being
   * dragged, which was therefore destroyed and recreated under the pointer.
   * The segments are a fixed count so they are built once; the dots are only
   * rebuilt when their number actually changes.
   */
  const segs = [];
  for (let i = 0; i < CURVE_SAMPLES; i++) {
    const seg = el("div", "curve-seg");
    seg.style.left = pct(i / (CURVE_SAMPLES - 1));
    segs.push(seg);
    line.appendChild(seg);
  }
  let dotNodes = [];

  function rebuildDots() {
    dots.textContent = "";
    dotNodes = points.map((p, i) => {
      const dot = el("div", "curve-dot");
      dot.addEventListener("pointerdown", (e) => beginDrag(e, i));
      dots.appendChild(dot);
      return dot;
    });
  }

  function paint() {
    for (let i = 0; i < CURVE_SAMPLES; i++) {
      segs[i].style.top = yPx(evalCurve(points, i / (CURVE_SAMPLES - 1)));
    }
    if (dotNodes.length !== points.length) rebuildDots();
    for (let i = 0; i < points.length; i++) {
      dotNodes[i].style.left = pct(points[i][0]);
      dotNodes[i].style.top = yPx(points[i][1]);
    }

    const changed = !isIdentityCurve(points);
    wrap.className = "curve" + (changed ? " modified" : "");
    readout.textContent = changed ? `${points.length} points` : "linear";
  }

  function setHistogram(bins) {
    hist.textContent = "";
    if (!bins || !bins.length) return;
    let peak = 0;
    for (const b of bins) if (b > peak) peak = b;
    if (peak <= 0) return;
    const w = 100 / bins.length;
    bins.forEach((b, i) => {
      const bar = el("div", "curve-bar");
      bar.style.left = (i * w).toFixed(3) + "%";
      bar.style.width = (w + 0.2).toFixed(3) + "%";
      // Square root, so a single dominant bin does not flatten everything else
      // into invisibility - this is a shape to read, not a measurement.
      bar.style.height = Math.round(Math.sqrt(b / peak) * (CURVE_H - 4)) + "px";
      hist.appendChild(bar);
    });
  }

  /** Pointer position as a 0..1 point in the box. */
  function at(e) {
    const r = box.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return [
      clampUnit((e.clientX - r.left) / r.width),
      clampUnit(1 - (e.clientY - r.top) / r.height),
    ];
  }

  let dragIndex = -1;

  function beginDrag(e, index) {
    if (e.altKey) {
      // Removing needs two points left over, or there is no curve.
      if (points.length > 2) {
        points.splice(index, 1);
        paint();
        onChange(copy(points), true);
      }
      if (e.preventDefault) e.preventDefault();
      return;
    }
    dragIndex = index;
    try {
      box.setPointerCapture(e.pointerId);
    } catch (err) {
      /* capture is an optimisation, not a requirement */
    }
    if (e.preventDefault) e.preventDefault();
  }

  box.addEventListener("pointerdown", (e) => {
    if (dragIndex >= 0) return; // a point handled it first
    const p = at(e);
    if (!p) return;
    // Near an existing point, grab it rather than stacking a new one on top.
    let near = -1;
    let best = CURVE_GRAB;
    points.forEach((q, i) => {
      const d = Math.hypot(q[0] - p[0], q[1] - p[1]);
      if (d < best) {
        best = d;
        near = i;
      }
    });
    if (near >= 0) {
      beginDrag(e, near);
      return;
    }
    points.push(p);
    points = normaliseCurve(points);
    dragIndex = points.findIndex((q) => q[0] === p[0] && q[1] === p[1]);
    paint();
    try {
      box.setPointerCapture(e.pointerId);
    } catch (err) {
      /* ignore */
    }
    if (e.preventDefault) e.preventDefault();
  });

  box.addEventListener("pointermove", (e) => {
    if (dragIndex < 0) return;
    const p = at(e);
    if (!p) return;
    const moved = points[dragIndex];
    // Keep the point between its neighbours: crossing one would reorder the
    // list under the drag and the point would jump out from under the pointer.
    const lo = dragIndex > 0 ? points[dragIndex - 1][0] + 0.01 : 0;
    const hi = dragIndex < points.length - 1 ? points[dragIndex + 1][0] - 0.01 : 1;
    moved[0] = clampUnit(Math.min(Math.max(p[0], lo), hi));
    moved[1] = p[1];
    paint();
    onChange(copy(points), false);
  });

  const endDrag = (e) => {
    if (dragIndex < 0) return;
    dragIndex = -1;
    try {
      box.releasePointerCapture(e.pointerId);
    } catch (err) {
      /* ignore */
    }
    points = normaliseCurve(points);
    paint();
    onChange(copy(points), true);
  };
  box.addEventListener("pointerup", endDrag);
  box.addEventListener("pointercancel", endDrag);

  reset.addEventListener("click", () => {
    points = normaliseCurve(def.def);
    paint();
    onChange(copy(points), true);
  });

  function set(v) {
    points = normaliseCurve(v);
    paint();
  }

  set(value);
  if (opts.getHistogram) setHistogram(opts.getHistogram());
  return { el: wrap, set, setHistogram };
}

function copy(pts) {
  return pts.map((p) => [p[0], p[1]]);
}

function clampUnit(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

/**
 * A collapsible section.
 *
 * The head carries a summary of the section's key values on the right, so a
 * collapsed section still says what it is set to. With a dozen sections and only
 * a couple of them open at a time, that is the difference between a panel you
 * can scan and one where every setting has to be hunted for.
 */
function createSection(id, label, open) {
  const section = el("div", "section" + (open ? " open" : ""));
  const head = el("div", "section-head");
  // A text glyph rather than a CSS triangle or a pseudo-element: UXP renders
  // neither, and a border-triangle came out as a solid square.
  const caret = el("div", "section-caret", open ? "\u25BC" : "\u25B6");
  const title = el("div", "section-title", label);
  const summary = el("div", "section-summary", "");
